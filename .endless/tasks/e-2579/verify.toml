# ── DO NOT EDIT ─────────────────────────────────────────────────────
# This suite belongs to E-2579 and records what was true when E-2579
# landed. Edit it only if you ARE E-2579. If your change breaks a check
# here, leave it alone — see .endless/tasks/CLAUDE.md.
schema = 1
task   = "E-2579"

[[check]]
name   = "undeclaredRefs is pinned to the live schema within the target tables; a session delete is refused while update, insert and annotate work"
runner = "gotest"
paths  = ["./internal/events/...", "./internal/correctcmd/..."]

[[check]]
name   = "the CLI relays the session delete refusal naming the rule, and --set hidden=1 still succeeds"
runner = "pytest/uv"
paths  = ["tests/test_correct_cmd.py"]

[[check]]
name     = "the pin test states which columns it recognizes as a reference, and that the naming rule is its limit"
sh       = "grep -c 'THIS IS THE TEST.S LIMIT' internal/events/correction_refs_test.go"
equals   = "1"

[[check]]
name     = "the one missing reference inside correct's scope, session_notices.changed_by_session, is on the list"
sh       = "grep -c 'changed_by_session\", \"sessions\", \"id\"' internal/events/correction.go"
equals   = "1"

[[check]]
name     = "no machine-local table outside correct's scope is on the list"
sh       = "grep -cE '^\t\\{\"(errors|errors_sources|error_triage|rater_claims)\",' internal/events/correction.go; true"
equals   = "0"

[[check]]
name     = "a comment beside the entry records that no current check reads it and the test keeps the list complete"
sh       = "grep -c 'No current check reads' internal/events/correction.go"
equals   = "1"

[[check]]
name     = "the list's comment states its scope is the ledger's, not the schema's"
sh       = "grep -c 'Its scope is the ledger' internal/events/correction.go"
equals   = "1"

[[check]]
name     = "the projector's replay comment names temp-database projection, not a routine rebuild of the live database"
sh       = "grep -A3 'If this path still DELETEd' internal/events/projector.go"
contains = "temp database"

[[check]]
name         = "the old wording is gone"
sh           = "grep -A3 'If this path still DELETEd' internal/events/projector.go"
not_contains = "a rebuild would re-free"

[[check]]
name     = "the session target keeps delete as a subcommand: the refusal names a rule, not a missing command"
sh       = "uv run endless correct session --help"
contains = "delete"

[[check]]
name     = "the guide appendix says a session is never deleted"
sh       = "grep -c 'never deleted' docs/guide/appendix-a.md"
equals   = "2"

[[check]]
name   = "no self-dev id reaches the guide or the help tree"
runner = "pytest/uv"
paths  = ["tests/test_no_self_dev_ids.py"]
