# Plan items for E-2579: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2579 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "undeclaredRefs lists all six missing session references, so the dangling-id check refuses a correcting write of a session id that names no session"
verify = "endless correct error_triage <key> --set accepted_session_id=<unused id> is refused naming sessions; same for the other five columns"

[[item]]
id = "P2"
kind = "deliverable"
statement = "The delete refusal counts those six, so a session one of them refers to cannot be deleted"
verify = "endless correct session <id> delete is refused for a session named only by an error_triage, errors, errors_sources or session_notices.changed_by_session row"

[[item]]
id = "P3"
kind = "deliverable"
statement = "A test derives every undeclared reference from the live schema and fails when undeclaredRefs and the schema disagree, in either direction"
verify = "go test ./internal/events/... fails when a row is removed from undeclaredRefs, and fails when a row names a table or column that no longer exists"

[[item]]
id = "P4"
kind = "deliverable"
statement = "The test states in a comment which columns it can recognize as a reference, and that a reference not matching the naming rule escapes both it and the list"
verify = "the comment is present and names the limit"

[[item]]
id = "P5"
kind = "exclusion"
statement = "No removed column, live_sessions view or session read-path audit: E-2570 is declined and sessions keep their current shape"

[[item]]
id = "P6"
kind = "exclusion"
statement = "sessions.id is not rebuilt with AUTOINCREMENT, and no migration is added"

[[item]]
id = "P7"
kind = "exclusion"
statement = "Which targets endless correct accepts is unchanged, session delete included"
