[[item]]
id = "P1"
kind = "deliverable"
statement = "Sources outside the job runner (monitor-wake, the stopfailure hook) can mark a failure transient, reusing the runner's transient handling: logged, and a fault only past the source's threshold"

[[item]]
id = "P2"
kind = "deliverable"
statement = "A success after logged transient failures closes the run without raising a fault"

[[item]]
id = "P3"
kind = "deliverable"
statement = "A failed git remote operation against github.com asks GitHub's status API, and while Git Operations is degraded opens an outage record instead of raising a fault, an authentication failure included"

[[item]]
id = "P12"
kind = "deliverable"
statement = "A stop on a self-clearing API error during an incident on Anthropic's status page opens an Anthropic outage instead of a fault"

[[item]]
id = "P5"
kind = "deliverable"
statement = "When the status API fails or reports no incident, the failure is handled as before the change"

[[item]]
id = "P13"
kind = "deliverable"
statement = "One outage-check job polls each provider with an open outage once a minute, makes no request when none is open, and closes the outage when the component reports operational"

[[item]]
id = "P14"
kind = "deliverable"
statement = "Closing a GitHub outage makes main-sync due at once"

[[item]]
id = "P4"
kind = "deliverable"
statement = "session status and session monitor show each open outage on its own line in a non-warning colour with no action hint"

[[item]]
id = "P15"
kind = "deliverable"
statement = "endless errors list shows open outages under their own heading, and --all adds closed ones"

[[item]]
id = "P16"
kind = "deliverable"
statement = "Agents receive open outages through hook context"

[[item]]
id = "P6"
kind = "deliverable"
statement = "Concurrent monitor-wake calls coalesce: one wake runs at a time and reruns once if another arrived meanwhile"

[[item]]
id = "P7"
kind = "deliverable"
statement = "monitor-wake retries a refused tmux connection with jittered backoff before counting it as a failure"

[[item]]
id = "P8"
kind = "deliverable"
statement = "WARN-0033 and WARN-0013 for self-clearing API errors are transient"

[[item]]
id = "P9"
kind = "deliverable"
statement = "A stop on max_output_tokens, authentication or billing errors is a fault on first occurrence"

[[item]]
id = "P10"
kind = "deliverable"
statement = "docs/errors.md and the guide describe transient failures and outages"

[[item]]
