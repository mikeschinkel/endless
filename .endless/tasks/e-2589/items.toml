[[item]]
id = "P1"
kind = "deliverable"
statement = "A fault source can mark a failure transient; a transient failure is logged and becomes a fault only when it persists past the source's threshold"

[[item]]
id = "P2"
kind = "deliverable"
statement = "A success after logged transient failures closes the run without raising a fault"

[[item]]
id = "P3"
kind = "deliverable"
statement = "A failed git remote operation against github.com checks GitHub's status API; while Git Operations is degraded Endless shows a notice naming the incident instead of a fault"

[[item]]
id = "P4"
kind = "deliverable"
statement = "The outage notice reaches both the user on session status and agents, and clears when the status API reports Git Operations operational"

[[item]]
id = "P5"
kind = "deliverable"
statement = "When the status API fails or reports no incident, a git remote failure falls through to the transient threshold"

[[item]]
id = "P6"
kind = "deliverable"
statement = "Concurrent monitor-wake calls coalesce: one wake runs at a time and reruns once if another arrived meanwhile"

[[item]]
id = "P7"
kind = "deliverable"
statement = "monitor-wake retries a refused tmux connection with jittered backoff before counting it as a failure"

[[item]]
id = "P8"
kind = "deliverable"
statement = "WARN-0033, main-sync's WARN-0001 and WARN-0013 for self-clearing API errors are transient"

[[item]]
id = "P9"
kind = "deliverable"
statement = "A stop on max_output_tokens, authentication or billing errors is a fault on first occurrence"

[[item]]
id = "P10"
kind = "deliverable"
statement = "docs/errors.md and the guide describe transient faults and the GitHub outage notice"

[[item]]
