# Plan items for E-2428: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2428 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "tmux init reads @server_uuid with show-options -gqv, stamps only when the read succeeds with no value, and on a failed read stamps nothing and refuses"
verify = "a Go test in internal/tmuxcmd with a failing tmux read"

[[item]]
id = "P2"
kind = "deliverable"
statement = "TmuxServerUUID reads with show-options -gqv, stamps only when the read succeeds with no value, and on a failed read stamps nothing and returns \"\""
verify = "a Go test in internal/monitor through the tmux command seam"

[[item]]
id = "P3"
kind = "deliverable"
statement = "A local table tmux_server_aliases (alias_uuid, server_uuid, recorded_at) exists in schema.sql and is added by a migration"
verify = "the schema/migration test"

[[item]]
id = "P4"
kind = "deliverable"
statement = "When an ID is first recorded, every other ID on the same socket first seen at or after the running server's start time is recorded as its alias"
verify = "a Go test in internal/monitor with a fixed start time"

[[item]]
id = "P5"
kind = "deliverable"
statement = "An ID on the same socket first seen before the running server's start time gets no alias"
verify = "a Go test in internal/monitor with a fixed start time"

[[item]]
id = "P6"
kind = "deliverable"
statement = "Every server-ID comparison in live_sessions.go, processes.go, liveness.go, triagejob/effects.go and events/session_status.go goes through one same-server function or SQL fragment that accepts an alias"
verify = "grep for direct server_uuid comparisons in those files"

[[item]]
id = "P7"
kind = "deliverable"
statement = "A session bound under an alias of the running server's ID reads live, is listed by session status, and is reached by session goto"
verify = "Go tests in internal/monitor, internal/triagejob and internal/events"

[[item]]
id = "P8"
kind = "deliverable"
statement = "A socket answering with an ID that is neither the recorded one nor its alias still proves the recorded server gone"
verify = "the E-2300 liveness tests, plus one with an alias"

[[item]]
id = "P9"
kind = "deliverable"
statement = "On this machine a6d29860 is recorded as an alias of 0ae20eaa, and ES-1339 reads tmux:live"
verify = "endless task show E-2206"

[[item]]
id = "P10"
kind = "exclusion"
statement = "Does not rewrite processes.server_uuid in existing rows"

[[item]]
id = "P11"
kind = "exclusion"
statement = "Does not reuse an earlier ID when stamping"

[[item]]
id = "P12"
kind = "deliverable"
statement = "runInit's doc comment names its callers (endless tmux start, when it starts a server and when it reuses the tasks server, and a manual run), not a session-created hook in ~/.tmux.conf"
verify = "read internal/tmuxcmd/init.go"

