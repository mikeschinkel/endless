[[item]]
id = "P1"
kind = "deliverable"
statement = "The graph's starting set is every row that has not landed and is either the session's own task or drawn at normal or bold intensity by rowIntensity and not stewarded by another session"
verify = "internal/sessionstatuscmd graph tests: graphSeeds over rows covering each case"

[[item]]
id = "P2"
kind = "deliverable"
statement = "The session's own task is in the starting set at any status until it has landed, including a terminal status"
verify = "internal/monitor session-graph test: a confirmed, unlanded own task's blockers are drawn"

[[item]]
id = "P3"
kind = "deliverable"
statement = "With the own task blocked by a task in another project that is itself blocked by a task another live session is working on, session status --graph draws that whole chain"
verify = "internal/monitor session-graph test with two projects; reproduces the E-2206 => E-2208 => E-2333 shape"

[[item]]
id = "P4"
kind = "deliverable"
statement = "The graph draws every open task the session's own task directly blocks or should precede; their own downstream tasks are not added"
verify = "internal/monitor session-graph test: a downstream task's own dependents are not added"

[[item]]
id = "P5"
kind = "deliverable"
statement = "In the graph, an in-flight task is drawn at normal intensity; only an id's later occurrences are dim"
verify = "internal/sessionstatuscmd graph render test"

[[item]]
id = "P6"
kind = "exclusion"
statement = "Does not change which rows the session-status table dims, hides or suppresses"

[[item]]
id = "P7"
kind = "exclusion"
statement = "Does not change the in_flight or on_list fields of the graph's --json output"

[[item]]
id = "P8"
kind = "deliverable"
statement = "Every task the graph draws, whether in the starting set, a blocker or a downstream task, has its open blockers added, and theirs, until a task has no open blocker"
verify = "internal/monitor session-graph test: a downstream task's blocker chain three deep is drawn"
