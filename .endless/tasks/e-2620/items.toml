[[item]]
id = "P1"
kind = "deliverable"
statement = "endless project init sets up git hooks before it places the verification-suite rules"

[[item]]
id = "P2"
kind = "deliverable"
statement = "When init creates or changes a lefthook config file, it commits that file in its own commit, subject 'Endless: set up lefthook for the Endless-Task trailer', before any other commit init makes"
verify = "tests/test_register.py: the first commit init makes contains lefthook.yml"

[[item]]
id = "P3"
kind = "deliverable"
statement = "A lefthook config file the user had uncommitted changes in before init is left out of that commit and named, as _commit_bring_up does today"

[[item]]
id = "P4"
kind = "deliverable"
statement = "Rebasing init's commits onto an unrelated root commit runs prepare-commit-msg with lefthook.yml present for every replayed commit"
verify = "tests/test_register.py, with a recording prepare-commit-msg hook and no lefthook installed"

[[item]]
id = "P5"
kind = "deliverable"
statement = "_commit_bring_up's commit rule is shared by both commits: it takes the candidate paths and the subject"

[[item]]
id = "P6"
kind = "exclusion"
statement = "Does not change commits the user made before running init"

[[item]]
id = "P7"
kind = "exclusion"
statement = "Does not change git_hook.setup's choice of lefthook-local.yml or lefthook.yml for Endless's commands"

[[item]]
id = "P8"
kind = "exclusion"
statement = "Does not rewrite history in projects already initialized"
