# Plan items for E-2308: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2308 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "endless-go calls dt.EnsureUserHomeDir() at startup; when it fails, paths print in full and the command still runs"

[[item]]
id = "P3"
kind = "deliverable"
statement = "internal/refusal exports a free-text display function that replaces $HOME/ with ~/, and bare $HOME when bounded as the analysis describes"
detail = "Bounded: preceded by start, whitespace, =, :, a quote or an opening bracket; followed by end, whitespace, a quote, , ; : a closing bracket, or a . followed by end or whitespace. /Users/mike.old and /Users/mikey are not touched."

[[item]]
id = "P4"
kind = "deliverable"
statement = "refusal.(*Error).Render applies the free-text function to both the person and the agent form"

[[item]]
id = "P5"
kind = "deliverable"
statement = "endless errors list, show, show --detail and log-only output, and the live-view fault row, pass stored summaries, details and field values through the free-text function"

[[item]]
id = "P6"
kind = "deliverable"
statement = "Every direct fmt print of a path value to stdout or stderr shows it in go-dt's ~ form (OrFullPath); the analyzer's printed-path rule reports none"

[[item]]
id = "P7"
kind = "deliverable"
statement = "A path passed into faults.Record as a Fields value or as a formatted argument of Summary or Detail is stored in ~ form"

[[item]]
id = "P8"
kind = "deliverable"
statement = "hookcmd's tildePath and the displayPath helpers in monitor and verifycmd are removed; their callers use go-dt's ~ form, and no output is cwd-relative"

[[item]]
id = "P9"
kind = "deliverable"
statement = "internal/pathlint holds an analyzer whose printed-path rule flags a go-dt path type passed to a stdout/stderr fmt print function without going through go-dt's ToTilde"

[[item]]
id = "P10"
kind = "deliverable"
statement = "The analyzer's untyped-path rule flags filepath.Join, Dir, Base, Abs, os.Getwd, os.UserHomeDir, os.MkdirTemp and os.TempDir, naming the go-dt replacement"

[[item]]
id = "P11"
kind = "deliverable"
statement = "A baseline file lists existing untyped-path sites by package, file and enclosing function; the analyzer skips them, and a test fails when the baseline lists a site that no longer exists"

[[item]]
id = "P12"
kind = "deliverable"
statement = "A Go test runs the analyzer over internal/ and cmd/, so just test-go fails on a new finding; a just lint recipe runs the same check"

[[item]]
id = "P13"
kind = "deliverable"
statement = "A test runs endless-go under a temp HOME — a path-naming refusal in both person and agent form, errors show and show --detail of a fault with a path, settings migrate, and a converted direct print — and fails if $HOME/ appears in the output"

[[item]]
id = "P15"
kind = "deliverable"
statement = "Python's endless.config.tilde() replaces home only at a path-segment boundary, so a home of /Users/mike leaves /Users/mikey unchanged"

[[item]]
id = "P16"
kind = "exclusion"
statement = "Does not change paths in JSON output, in files written, in the detail log's format, or in arguments passed to other programs"

[[item]]
id = "P17"
kind = "exclusion"
statement = "Does not change the absolute path printed by endless-go verify for --report-dir or by sandbox seed/reset for the sandbox directory"

[[item]]
id = "P18"
kind = "exclusion"
statement = "Does not convert the baselined plain-string path code to go-dt types"

[[item]]
id = "P19"
kind = "exclusion"
statement = "Does not add a function to go-dt"

[[item]]
id = "P20"
kind = "exclusion"
statement = "Does not change monitor's homeRelative stored form of projects.path"

[[item]]
id = "P21"
kind = "deliverable"
statement = "Every path in a PreToolUse hook refusal shows in ~ form, including the /cd line and the worktree to re-target under"
verify = "hookcmd tests for writeTargetRedirect, cdRedirect, bashWritesRefusal and unboundWorktreeInstruction assert ~/ paths and no $HOME/"
