# Verification suite for E-2296: claim, spawn and prime refuse a task with a
# live blocker, naming every blocker, with no override.
#
# DO NOT EDIT unless you ARE E-2296 — see .endless/tasks/CLAUDE.md.
#
# The unit tests run first; the last check drives the real CLI end to end
# (e2e.sh, beside this file).

schema = 1
task   = "E-2296"

# The blocks refusal, and the plan, question and precedes gates beside it.
[[check]]
runner = "pytest/uv"
paths  = ["tests/test_blocks_gate.py", "tests/test_precedes_gate.py",
          "tests/test_prime.py", "tests/test_spawn_gate.py"]

# End to end through the real CLI. e2e.sh uses the shared harness, which writes
# TAP to $ENDLESS_VERIFY_TAP: point that at stdout (fd 3) and send the harness's
# human-readable lines to stderr.
[[check]]
runner  = "sh"
command = "ENDLESS_VERIFY_TAP=/dev/fd/3 bash \"$ENDLESS_VERIFY_DIR\"/e2e.sh 3>&1 1>&2"
format  = "tap"
