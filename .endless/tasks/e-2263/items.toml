# Plan items for E-2263: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2263 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "endless verify E-N runs the same suite as endless task verify E-N, and endless task verify keeps working"

[[item]]
id = "P2"
kind = "deliverable"
statement = "A verify an agent requests opens a background tmux window named E-NNNN-verify in the user's current tmux session"

[[item]]
id = "P3"
kind = "deliverable"
statement = "The suite in that window runs in a fresh login, interactive shell whose environment carries none of the agent-only variables (CLAUDECODE, AI_AGENT, CLAUDE_CODE_*)"

[[item]]
id = "P4"
kind = "deliverable"
statement = "The command blocks until the run ends, then prints the result and the CTRF report path, and exits non-zero on failure"

[[item]]
id = "P5"
kind = "deliverable"
statement = "Before opening a window, the request refuses while the task's reconciliation is stale or a discrepancy question is unanswered, through the shared reconciliation gate in internal/reconcilegate"

[[item]]
id = "P6"
kind = "deliverable"
statement = "Before running the suite, verify rebases the branch onto main using the rebase preparation land already has"

[[item]]
id = "P7"
kind = "deliverable"
statement = "A pass records the commit it tested and the main commit it was rebased onto"

[[item]]
id = "P8"
kind = "deliverable"
statement = "A rebase conflict stops the run before the suite starts, writes no pass and moves no status"

[[item]]
id = "P9"
kind = "deliverable"
statement = "On a rebase conflict, the owning session is sent the conflicted files and asked to resolve them and request verify again, and the user is asked nothing"

[[item]]
id = "P10"
kind = "deliverable"
statement = "The conflict message reaches the owning session through the error triage job's routes, pulled out of internal/triagejob into a shared piece both jobs call, not copied"

[[item]]
id = "P11"
kind = "deliverable"
statement = "On a pass, the window closes and the full log is kept beside the CTRF report"

[[item]]
id = "P12"
kind = "deliverable"
statement = "On a failure, the window stays open"

[[item]]
id = "P13"
kind = "deliverable"
statement = "endless verify E-N --show moves the run's pane into the task's own tmux window, to the right of its bottom-right pane, and --hide moves it back out"

[[item]]
id = "P14"
kind = "deliverable"
statement = "With no run in progress, --show opens a pane on the last run's log"

[[item]]
id = "P15"
kind = "deliverable"
statement = "Neither --show nor --hide starts a run, and the two are refused together"

[[item]]
id = "P16"
kind = "deliverable"
statement = "Only handoff runs, requested through this command after the work is declared ready, are counted; an agent's working runs during implementation are not"

[[item]]
id = "P17"
kind = "deliverable"
statement = "After 3 failed handoff runs, the command stops and asks the user before another handoff run"

[[item]]
id = "P18"
kind = "deliverable"
statement = "A handoff run after the task's verify.toml changed since the first failed handoff run waits for the user's approval"

[[item]]
id = "P19"
kind = "exclusion"
statement = "Does not replace the blocking wait with a completion message; that waits for messaging via Claude Mods"

[[item]]
id = "P20"
kind = "exclusion"
statement = "Does not add an adversarial agent that writes the verify suite"
