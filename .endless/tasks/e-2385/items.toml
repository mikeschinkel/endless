# Plan items for E-2385: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2385 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "With endless-tasks not running, task spawn, task claim's window and auto-spawn refuse with \"Endless isn't running. Run `endless start`\" and create nothing"
verify = "Go spawn-window test and Python gate tests with the server down"

[[item]]
id = "P2"
kind = "deliverable"
statement = "No spawn, claim or auto-spawn opens a window on any tmux server other than endless-tasks, whether or not $TMUX is set"

[[item]]
id = "P3"
kind = "deliverable"
statement = "--tmux-session names a session on endless-tasks, never on the caller's server"

[[item]]
id = "P4"
kind = "deliverable"
statement = "No command other than endless start starts an Endless tmux server"

[[item]]
id = "P5"
kind = "deliverable"
statement = "endless stop tasks, endless stop console, and endless stop all (also --all) exist, also as endless tmux stop; stop with no argument prints usage"

[[item]]
id = "P6"
kind = "deliverable"
statement = "stop tasks refuses while any session on endless-tasks is working, listing them; --force skips the refusal"

[[item]]
id = "P7"
kind = "deliverable"
statement = "stop tasks types /exit into each Claude pane and stops the server only after every Claude has quit; stragglers at the timeout are listed and the server is left running unless --force"

[[item]]
id = "P8"
kind = "deliverable"
statement = "Closing windows during stop tasks does not rewrite the restore record: it holds the task windows open when stop began, in tab order"

[[item]]
id = "P9"
kind = "deliverable"
statement = "stop console stops endless-console; stop all stops tasks first and does not stop the console when the tasks stop refuses or leaves its server running"

[[item]]
id = "P10"
kind = "deliverable"
statement = "Stopping a server that is not running reports it as already stopped and exits zero"

[[item]]
id = "P11"
kind = "deliverable"
statement = "The restore record keeps task windows in tab order, and a reorder alone rewrites it"

[[item]]
id = "P12"
kind = "deliverable"
statement = "endless start restores task windows in the tab order recorded, including relative to windows already open"

[[item]]
id = "P13"
kind = "deliverable"
statement = "With no terminal configured or detected, endless start opens Terminal.app on macOS, and on Linux xdg-terminal-exec or x-terminal-emulator when on PATH, before falling back to printing attach commands"

[[item]]
id = "P14"
kind = "exclusion"
statement = "Does not change session liveness or how dead sessions are judged (E-2300)"

[[item]]
id = "P15"
kind = "exclusion"
statement = "Does not filter hooks by tmux server (E-2302)"

[[item]]
id = "P16"
kind = "exclusion"
statement = "Does not open a Windows Terminal window from WSL or support native Windows"

[[item]]
id = "P17"
kind = "exclusion"
statement = "Does not move existing sessions off the user's default tmux server"
