[[item]]
id = "P1"
kind = "deliverable"
statement = "The machine config key claude.transcripts.retention_days sets the Endless retention value in whole days of at least 1, and it is 3650 when unset"
verify = "Go and Python tests reading the key, unset, set and invalid"

[[item]]
id = "P2"
kind = "deliverable"
statement = "endless setup claude-hook sets cleanupPeriodDays in the user's Claude settings file to the Endless value when it is unset or lower, after showing the change and asking"
verify = "a test in tests/ with a temporary Claude home"

[[item]]
id = "P3"
kind = "deliverable"
statement = "endless setup claude-hook never lowers a cleanupPeriodDays that is higher than the Endless value, and reports it"
verify = "a test in tests/"

[[item]]
id = "P4"
kind = "deliverable"
statement = "When a managed Claude settings file sets a lower cleanupPeriodDays, endless setup claude-hook writes nothing for it and names the managed value"
verify = "a test in tests/"

[[item]]
id = "P5"
kind = "deliverable"
statement = "endless setup claude-hook --yes applies every change it would otherwise ask about, hooks and retention, without asking"
verify = "a test in tests/"

[[item]]
id = "P6"
kind = "deliverable"
statement = "endless setup claude-hook finds Claude's settings under CLAUDE_CONFIG_DIR when it is set"
verify = "a test in tests/"

[[item]]
id = "P7"
kind = "deliverable"
statement = "The Claude SessionStart hook shows a systemMessage naming the current value, the Endless value and endless setup claude-hook when cleanupPeriodDays is below the Endless value, and shows nothing when it is at or above it"
verify = "Go tests in internal/hookcmd for below, equal, above and managed"

[[item]]
id = "P8"
kind = "deliverable"
statement = "endless doctor reports a cleanupPeriodDays below the Endless value as a problem, fixable with confirmation by the same write setup makes"
verify = "a Go test of the registered check"

[[item]]
id = "P9"
kind = "deliverable"
statement = "The guide documents claude.transcripts.retention_days, what endless setup claude-hook changes in Claude's settings, and the SessionStart warning"
verify = "read the guide"

[[item]]
id = "P10"
kind = "exclusion"
statement = "Does not write cleanupPeriodDays into any project's .claude/settings.json or .claude/settings.local.json"

[[item]]
id = "P11"
