[[item]]
id = "P1"
kind = "deliverable"
statement = "endless and endless-go accept a global --base-dir in any argument position; it defaults to / and, at /, every verdict is unchanged from today"
verify = "full Go and Python suites pass; a run without the flag refuses the same directories as main"

[[item]]
id = "P2"
kind = "deliverable"
statement = "Every built-in rule path and every overrides-file path is read relative to the base directory (/private becomes <base>/private)"
verify = "Go test: with base set to a fake root, <base>/private/x is refused and /private/x on the host is outside the base"

