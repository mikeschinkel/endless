# Plan items for E-1358: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-1358 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "A hook error site whose failure leaves session tracking, a worktree lock or a gate's state wrong returns its error, so it blocks wherever the event blocks"
verify = "Go test: a failing state site on PreToolUse exits 2"

[[item]]
id = "P2"
kind = "deliverable"
statement = "A hook error site whose failure affects only side work (DB backup, A/B sampling, report labels) stays non-blocking and records a fault"
verify = "Go test: a failing side-work site exits 0 and leaves a fault row"

[[item]]
id = "P3"
kind = "deliverable"
statement = "A probe records in the task notes whether a Stop hook's exit-2 stderr reaches the model"

[[item]]
id = "P4"
kind = "deliverable"
statement = "If the probe shows it reaches the model, a Stop or SubagentStop hook error exits 2 when stop_hook_active is false and 1 when it is true; otherwise it exits 1 as today"
verify = "Go test over both payloads"

[[item]]
id = "P5"
kind = "deliverable"
statement = "A schema refusal exits with the event's blocking code instead of 0, and still records one fingerprinted fault"
verify = "Go test: schema refusal on PreToolUse exits 2"

[[item]]
id = "P6"
kind = "deliverable"
statement = "endless setup claude-hook writes onFailure \"block\" on the PreToolUse and UserPromptSubmit entries"

[[item]]
id = "P7"
kind = "deliverable"
statement = "Re-running endless setup claude-hook on an older install rewrites the existing Endless entries in place rather than adding duplicates"

[[item]]
id = "P8"
kind = "deliverable"
statement = "endless setup claude-hook refuses on a Claude Code older than 2.1.295, naming the installed and required versions, and installs nothing"

[[item]]
id = "P9"
kind = "deliverable"
statement = "endless hook bypass <session_ref> makes that session's hook errors non-blocking from its next hook call, including a session already running"

[[item]]
id = "P10"
kind = "deliverable"
statement = "endless hook bypass accepts an ES ref or a Claude session id as session_ref, and when an ES ref cannot be resolved it refuses and says to pass the Claude session id"

[[item]]
id = "P11"
kind = "deliverable"
statement = "endless hook bypass --all makes every session's hook errors non-blocking and expires after one hour unless --for is given"

[[item]]
id = "P12"
kind = "deliverable"
statement = "--for <duration> sets the expiry on both forms; a session bypass without --for lasts until that session ends"

[[item]]
id = "P13"
kind = "deliverable"
statement = "endless hook bypass --clear removes the bypass for one session or, with --all, every bypass"

[[item]]
id = "P14"
kind = "deliverable"
statement = "endless hook bypass with neither a session_ref nor --all refuses with usage"

[[item]]
id = "P15"
kind = "deliverable"
statement = "endless hook bypass refuses when run by an agent"

[[item]]
id = "P16"
kind = "deliverable"
statement = "The bypass is stored in a file in the user's Endless config directory, and the hook reads it without opening the database"

[[item]]
id = "P17"
kind = "deliverable"
statement = "Under a bypass a hook error is logged, records a fault and exits 1 with a one-line notice, and worktree and main-branch gates still refuse"

[[item]]
id = "P18"
kind = "deliverable"
statement = "The blocked-hook notice names endless hook bypass as what a person runs to let a fix session through"

[[item]]
id = "P19"
kind = "deliverable"
statement = "Setup output and the guide name Claude Code's disableAllHooks setting as the escape when the hook binary itself is missing"

