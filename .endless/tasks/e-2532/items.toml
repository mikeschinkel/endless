# Plan items for E-2532: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2532 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "The outcome names the Endless-driven sessions from the last 30 days that were sampled, and how many had no transcript on disk"

[[item]]
id = "P2"
kind = "deliverable"
statement = "Every sampled session's handover message (the one that flipped the task to unverified or unreviewed) is labeled, with each handed-over command's form recorded: tagged fence, untagged fence, inline span, bare prose"
verify = "A labels file in the scratchpad, one row per command, path named in the outcome"

[[item]]
id = "P3"
kind = "deliverable"
statement = "A random sample of non-handover assistant messages containing code is labeled block by block as command-for-the-user or not, with the not-command category named"

[[item]]
id = "P4"
kind = "deliverable"
statement = "The outcome holds a table of hook event kinds present in the hook log, stating for each whether its payload carries assistant text and whether mid-turn text appears in it"

[[item]]
id = "P5"
kind = "deliverable"
statement = "A throwaway extractor in the scratchpad applies at least one candidate capture rule to the sampled transcripts and reports its measured capture rate and false-positive rate against the labels"
verify = "Run the extractor as the outcome describes; its printed rates match the outcome"

[[item]]
id = "P6"
kind = "deliverable"
statement = "The outcome answers each of the five questions in the task context with a count"

[[item]]
id = "P7"
kind = "deliverable"
statement = "The outcome ends with a one-paragraph recommendation for E-2531: hook capture, a fence-tag convention, or neither"

[[item]]
id = "P8"
kind = "exclusion"
statement = "Does not add, change or register any hook"

[[item]]
id = "P9"
kind = "exclusion"
statement = "Does not commit the extractor or the labels to the repository"
