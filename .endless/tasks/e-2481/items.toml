# Plan items for E-2481: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2481 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "endless-go sandbox offers only `init --mode worktree`, `reset` and `claude-settings-repair`; `run`, `enter`, `init <name>`, `list`, `prune` and `destroy` are refused as unknown commands, and the usage text names none of them"
verify = "internal/sandboxcmd test on the dispatcher and usage text"

[[item]]
id = "P2"
kind = "deliverable"
statement = "No code under internal/, cmd/ or src/ reads or writes the cache directory's sandboxes/ subdirectory"
verify = "grep for sandboxesDir and the cache path; internal/sandboxcmd builds without it"

[[item]]
id = "P3"
kind = "deliverable"
statement = "A worktree reap no longer calls a sandbox reaper: monitor.ReapSandbox and sandboxcmd.ReapSandboxForWorktree are gone, and code used only by them is removed"
verify = "internal/monitor reap tests pass; grep finds neither name"

[[item]]
id = "P4"
kind = "deliverable"
statement = "Reaping or dropping a worktree still removes its sandbox at <worktree>/.endless/sandbox"
verify = "existing worktree reap/drop tests"

[[item]]
id = "P5"
kind = "deliverable"
statement = "The Python CLI no longer refuses commands under ENDLESS_SANDBOX: the refusal in cli.py, SANDBOX_SAFE_SUBCOMMANDS and db.py's ENDLESS_SANDBOX branch are gone, with their tests"
verify = "pytest; grep finds no ENDLESS_SANDBOX in src/"

[[item]]
id = "P6"
kind = "deliverable"
statement = "Endless sets XDG_CONFIG_HOME nowhere"
verify = "grep over internal/, cmd/ and src/ for an assignment of XDG_CONFIG_HOME"

[[item]]
id = "P7"
kind = "deliverable"
statement = "ED-1072 is marked obsolete, naming E-2481"
verify = "endless decision show ED-1072"

[[item]]
id = "P8"
kind = "deliverable"
statement = "No guide page or CLI text names a removed sandbox subcommand or a named sandbox"
verify = "grep over docs/guide and src/"

[[item]]
id = "P9"
kind = "exclusion"
statement = "Does not delete or report an existing ~/.cache/endless/sandboxes/ on any machine"

[[item]]
id = "P10"
kind = "exclusion"
statement = "Does not change how a worktree sandbox is created, seeded, reset or located"
