[[item]]
id = "P1"
kind = "deliverable"
statement = "The settings registry has path, name and command kinds, each with a shape check and a JSON export name"
verify = "internal/settings tests"

[[item]]
id = "P2"
kind = "deliverable"
statement = "A registered default that fails its kind's shape check fails settings.Initialize, as for the existing kinds"
verify = "internal/settings tests"

[[item]]
id = "P3"
kind = "deliverable"
statement = "tmux.socket_dir, tmux.console_server, tmux.tasks_server, tmux.tasks_session and tmux.terminal are registered under feature tmux, machine file only, not suggestable, with the defaults Resolve uses when unset"
verify = "endless-go settings list"

[[item]]
id = "P4"
kind = "deliverable"
statement = "tmuxservers.Resolve refuses a configured tmux value that fails its key's shape check, naming the key and what it takes, using the same checks as the registry"
verify = "internal/tmuxservers tests"

[[item]]
id = "P5"
kind = "deliverable"
statement = "tmuxservers.Resolve refuses a socket path (directory plus socket name) longer than tmux accepts"
verify = "internal/tmuxservers tests"

[[item]]
id = "P6"
kind = "deliverable"
statement = "settings_export.accepted and parse describe and parse values of the three new kinds"
verify = "tests for settings_export"

[[item]]
id = "P7"
kind = "deliverable"
statement = "tmux.session_name is gone from unregisteredKeys, maxUnregistered is 20, and TestEveryConfigKeyIsRegistered passes"
verify = "go test ./cmd/endless-go/"

[[item]]
id = "P8"
kind = "exclusion"
statement = "Does not change where the socket directory's ownership and permission checks run"

[[item]]
id = "P9"
kind = "exclusion"
statement = "Does not register any config key outside tmux (E-2303)"

[[item]]
id = "P10"
