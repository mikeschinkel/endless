# Plan items for E-2516: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2516 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "The outcome states the cross-project rule in plain words: a session works only in its own project, delegates other projects' work to a task in that project with a blocker on its own task, and never commits, lands, tags or releases another project's in-flight work whatever its plan says"
verify = "endless task show <id> --outcome"

[[item]]
id = "P2"
kind = "deliverable"
statement = "The outcome names each place a session learns its rules, says which carry the rule and why, and answers whether a shared instruction file imported by the user-level CLAUDE.md is one of them"
verify = "endless task show <id> --outcome"

[[item]]
id = "P3"
kind = "deliverable"
statement = "The outcome says whether Endless should enforce the rule with a hook or check, and what that enforcement would allow and refuse"
verify = "endless task show <id> --outcome"

[[item]]
id = "P4"
kind = "deliverable"
statement = "The outcome says whether plan-authoring guidance or plan review should catch a plan step that tells a session to change another project's work, and names the existing tasks or decisions that already cover any part of this"
verify = "endless task show <id> --outcome"

[[item]]
id = "P5"
kind = "exclusion"
statement = "Does not change any guide text, template, hook or CLAUDE.md; the outcome recommends follow-up tasks and the user decides which to file"

[[item]]
id = "P6"
kind = "deliverable"
statement = "The outcome proposes the tasks to file, each with a title, project, one-line description and the reason it cannot fold into an existing task, with symptoms of one cause grouped into one task, and the research itself files nothing"
verify = "endless task show E-2516 --outcome"
