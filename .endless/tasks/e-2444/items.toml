# Plan items for E-2444: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2444 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "A deliverable plan item can carry a post_land flag, set via post_land = true in an items file or --post-land on task plan add and task plan edit, and stored durably through the event pipeline"
verify = "Go and Python tests; ledger rebuild reproduces the flag"

[[item]]
id = "P2"
kind = "deliverable"
statement = "question answer EQ-n --post-land, on an open blocked question filed for a plan item, marks that item post_land and records it as approved by the user"

[[item]]
id = "P3"
kind = "deliverable"
statement = "The deliverable verdict deferred is accepted only on a post_land item, is not a discrepancy, files no question, and passes the reconcile gate"

[[item]]
id = "P4"
kind = "deliverable"
statement = "Task status landed exists, with transitions unlanded -> landed (user), landed -> assumed (system), and landed -> revisit, declined, obsolete and superseded (user), and no transition to confirmed"
verify = "internal/taskstatus transition tests"

[[item]]
id = "P5"
kind = "deliverable"
statement = "docs/status-lifecycle.mmd and its copies in README.md and docs/guide/index.md show landed and its transitions, regenerated by just lifecycle-index"
verify = "just lifecycle-check; just test"

[[item]]
id = "P6"
kind = "deliverable"
statement = "Every taskstatus group has an explicit membership decision for landed, and landed is in the frozen statuses apart from its post-land items"

[[item]]
id = "P7"
kind = "deliverable"
statement = "worktree land, including --record-only, sets landed instead of assumed when the task has an active post_land item, and lists its open post-land items"

[[item]]
id = "P8"
kind = "deliverable"
statement = "task reconcile on a landed task shows and accepts entries for post_land items only, and refuses entries for any other item"

[[item]]
id = "P9"
kind = "deliverable"
statement = "A post-land reconcile is recorded as its own event kind and writes one row per post-land item to a new table keyed to the reconciliation in force at the land, leaving earlier reconciliation rows unchanged and copying no other item's verdict"
verify = "Go event tests including ledger replay"

[[item]]
id = "P10"
kind = "deliverable"
statement = "A post-land discrepancy files a question, and answer_holds / reask compare against the item's previous post-land row"

[[item]]
id = "P11"
kind = "deliverable"
statement = "A landed task moves to assumed on the post-land reconcile or withdrawal after which every post-land item has a non-deferred verdict and every post-land discrepancy's question is settled, and stays landed otherwise"

[[item]]
id = "P12"
kind = "deliverable"
statement = "task reconcile on a landed task is refused when the branch fingerprint is not empty, with a message naming a --cleans-up follow-up task as the remedy"

[[item]]
id = "P13"
kind = "deliverable"
statement = "The user, and no agent, can withdraw a post_land item on a landed task"

[[item]]
id = "P14"
kind = "deliverable"
statement = "Readers of an item's current verdict (task plan list, the reconcile context display, monitor plan items, the reconcile gate) use the newest post-land row when one exists"

[[item]]
id = "P15"
kind = "deliverable"
statement = "A landed task still blocks its dependents"

[[item]]
id = "P16"
kind = "deliverable"
statement = "The status group Shipped (slug shipped) is renamed Reported (slug reported) and ShippedTerminal is renamed ReportedTerminal, with every caller updated"

[[item]]
id = "P17"
kind = "deliverable"
statement = "The session-status and project-status action with glyph ⏚ is labeled shipped and applies to a task with at least one landing, and to a completed research or brainstorm task"

[[item]]
id = "P18"
kind = "deliverable"
statement = "Task text that uses shipped for task state (transition labels, guide, help, messages) matches the definition: landed at least once, or for research and brainstorm, completed"

[[item]]
id = "P19"
kind = "deliverable"
statement = "The landed status has its own status glyph and its own session-status action, ranked above the shipped action, each one column wide"
verify = "TestGlyphsAreSingleWidth and the status glyph tests"

[[item]]
id = "P20"
kind = "deliverable"
statement = "Recording a deferred verdict prints that the land will set landed and names the post-land reconcile to run then; a post-land discrepancy prints that the task stays landed until the item settles"

[[item]]
id = "P21"
kind = "deliverable"
statement = "The per-prompt hook context, task show and task list show a landed task's open post-land items"

[[item]]
id = "P22"
kind = "deliverable"
statement = "task active includes landed tasks"

[[item]]
id = "P23"
kind = "deliverable"
statement = "endless guide tasks/post-land documents post-land items, the deferred verdict, the landed status, the post-land reconcile, the fingerprint refusal and the code-means-follow-up-task rule, and the tasks section links to it; the index's status and blocking text covers landed"

[[item]]
id = "P24"
kind = "exclusion"
statement = "Does not add a time-based fault for a task that stays landed"

[[item]]
id = "P25"
kind = "exclusion"
statement = "Does not allow deferred on exclusion items"

[[item]]
id = "P26"
kind = "exclusion"
statement = "Does not merge assumed and confirmed into one status"

[[item]]
id = "P27"
kind = "exclusion"
statement = "Does not create a glossary"
