# Plan items for E-2370: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2370 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "When a bound task's worktree is missing, session resume and session goto --resume classify it three ways: landed (names --review/--reopen), never landed with a task/N branch locally or on a remote (names --reopen), never landed with no branch anywhere (\"never had a worktree\", names --recreate); \"dropped after landing\" is said only for the first"
verify = "tests/test_session_resume_recover.py"

[[item]]
id = "P2"
kind = "deliverable"
statement = "session resume --recreate creates a fresh worktree for the task on a new task/N branch cut from the project's base-branch tip, then resumes the session's transcript in it, leaving the task's status unchanged"
verify = "tests/test_session_resume_recover.py"

[[item]]
id = "P3"
kind = "deliverable"
statement = "--recreate refuses, creating nothing, when the task's worktree exists, when a task/N branch exists locally or on a remote (naming --reopen), or when the task has a landing (naming --review/--reopen)"
verify = "tests/test_session_resume_recover.py"

[[item]]
id = "P13"
kind = "deliverable"
statement = "The --recreate path and the missing-worktree classification resolve the git repo from the task's own project (its projects.path), not from the project enclosing the shell's cwd, so the worktree, the task/N branch check and the landing check all happen in the task's repo"
verify = "tests/test_session_resume_recover.py (resume run from another project's directory)"

[[item]]
id = "P4"
kind = "deliverable"
statement = "--recreate is mutually exclusive with --review and --reopen"
verify = "tests/test_session_resume_recover.py"

[[item]]
id = "P5"
kind = "deliverable"
statement = "Every existing resume gate runs before --recreate creates anything: epic refusal, declined/obsolete refusal, missing transcript, missing UUID, pane clobber (--force), window rebind and sibling-pane gates, projectless session"
verify = "tests/test_session_resume_recover.py, tests/test_session_resume_crash_recovery.py"

[[item]]
id = "P6"
kind = "deliverable"
statement = "A session resumed with --recreate receives a notice, as the initial prompt of `claude --resume`, saying its worktree was freshly created at the base-branch tip, that edits it made elsewhere are not present, and that it should rebuild them from its transcript"
verify = "tests/test_session_resume_recover.py (argv assertion)"

[[item]]
id = "P7"
kind = "deliverable"
statement = "Bulk resume (--tmux-session / --all-tmux-sessions) adds --review only for a task with a landing, never runs --recreate, and for a never-had-a-worktree task skips the window with a summary line that suggests the --recreate command"
verify = "internal/resumewindowscmd/resumewindows_test.go"

[[item]]
id = "P8"
kind = "deliverable"
statement = "--dry-run with --recreate prints the resolved decision (intent recreate, base, branch, worktree) without creating the worktree or launching claude"
verify = "tests/test_session_resume_recover.py"

[[item]]
id = "P9"
kind = "deliverable"
statement = "The session resume help text and docs/guide (appendix-a, orchestration) describe --recreate and the three-way classification"

[[item]]
id = "P10"
kind = "exclusion"
statement = "No resume path ever targets the project root or the session's previous cwd"

[[item]]
id = "P11"
kind = "exclusion"
statement = "Does not change --review or --reopen behavior, or how task claim creates worktrees"

[[item]]
id = "P12"
kind = "exclusion"
statement = "Does not fix resume looking in the wrong repo for a cross-project task (that is E-2299) or add worktree move (that is E-2348)"
