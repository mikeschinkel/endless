# Plan items for E-2664: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2664 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "Endless has a 'plan' task type, and a plan task can be filed with only a brief; Context and Analysis can also be given but are not required"

[[item]]
id = "P2"
kind = "deliverable"
statement = "task spawn accepts a plan-type task that has no plan, gating on the type rather than on a flag or a new status"

[[item]]
id = "P3"
kind = "deliverable"
statement = "A spawned plan task's session receives a plan-type handoff document whose job is to write the task's plan and submit it for approval"

[[item]]
id = "P4"
kind = "deliverable"
statement = "The plan-type handoff document carries the rules of the /needs-plan command, so no skill is needed to plan a task"

[[item]]
id = "P5"
kind = "deliverable"
statement = "Filing a plan task spawns it by default without changing which tmux window has focus, and --no-spawn files it without spawning"

[[item]]
id = "P6"
kind = "deliverable"
statement = "A plan task's eventual type may be proposed by the filer, is proposed or changed by the planning session, and is ratified by the user; it can only be a do type (todo, bugfix, or a future do type such as docs)"

[[item]]
id = "P7"
kind = "deliverable"
statement = "Once its plan is approved, a plan task converts to its ratified do type, keeping its ID, and that type's handoff document applies from then on"

[[item]]
id = "P8"
kind = "deliverable"
statement = "Research and brainstorm tasks can be filed and spawned with a brief alone, without a plan"

[[item]]
id = "P9"
kind = "deliverable"
statement = "endless guide explains how to file a plan task well enough that a user can say 'file a plan task to do X' with no skill loaded"

[[item]]
id = "P10"
kind = "exclusion"
statement = "Research and brainstorm tasks are never filed as plan tasks"
