# Plan items for E-2424: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2424 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "Each registered project has its own database file at ~/.config/endless/projects/<slug>.db, named by its machine-local slug, and the self_dev sandbox mirrors this layout under its own config dir"

[[item]]
id = "P2"
kind = "deliverable"
statement = "Project files hold tasks (with live_tasks and task_tree), task_content, task_questions, task_deps, task_landings, decisions and decision_relations; the machine file holds none of them"

[[item]]
id = "P3"
kind = "deliverable"
statement = "task_types, complexity_levels and risk_levels are seeded in both the machine file and every project file"

[[item]]
id = "P4"
kind = "deliverable"
statement = "Each project file has a one-row identity table holding the project's root-commit identity and committed name, written by ledger replay"

[[item]]
id = "P5"
kind = "deliverable"
statement = "task_landings.session_id and decisions.origin_session_id keep their values with no FK constraint"

[[item]]
id = "P6"
kind = "deliverable"
statement = "Every command opens the machine file as main and attaches the project files it needs, resolved through the --db main|sandbox context"

[[item]]
id = "P7"
kind = "deliverable"
statement = "Rebuilding a project deletes and rebuilds only that project's file from its own ledger"

[[item]]
id = "P8"
kind = "deliverable"
statement = "Machine migrations apply to the machine file and project migrations to every project file, each file with its own goose_db_version"

[[item]]
id = "P9"
kind = "deliverable"
statement = "TestMigrate_MatchesSchemaSQL passes for the machine schema and for the project schema"

[[item]]
id = "P10"
kind = "deliverable"
statement = "A one-time migration moves today's single database into the split after a backup, and reports any difference between each project file and a replay of that project's ledger before it drops anything"

[[item]]
id = "P11"
kind = "exclusion"
statement = "The migration does not carry over project_deps, session_statuses or the adhoc_e2191_backlog table and view, and drops nothing without Mike's go-ahead"

[[item]]
id = "P12"
kind = "exclusion"
statement = "Does not change task id format or allocate ids across machines (E-799)"
