[[item]]
id = "P17"
kind = "deliverable"
statement = "endless task update E-N --steward E-M stores task E-M as E-N's steward task through a task.steward_set event, whether or not a session holds E-M now, and a rebuild from the ledger restores it"
verify = "a Go executor test and a replay test"

[[item]]
id = "P18"
kind = "deliverable"
statement = "--steward takes only a task id: an ES-N is refused, and the refusal names the session's claimed task to use instead, or says it holds none"
verify = "a test in tests/"

[[item]]
id = "P19"
kind = "deliverable"
statement = "The session status board of a session claiming E-M lists every task whose steward task is E-M, and setting E-M clears any hide of E-N by a session claiming E-M"
verify = "a Go test in internal/monitor and a test in tests/"

[[item]]
id = "P20"
kind = "deliverable"
statement = "endless task update E-N --steward none removes the chosen steward, and the steward is worked out again from filing and editing"
verify = "a test in tests/"

[[item]]
id = "P21"
