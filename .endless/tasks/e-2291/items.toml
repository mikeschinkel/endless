kind = "deliverable"
statement = "sessiontaskrelation has a bound relation (slug bound, label Bound) at the next free id, with a schema.sql seed row and a migration, and VerifyIntegrity passes"
verify = "Go tests in internal/sessiontaskrelation and the seed integrity check"

