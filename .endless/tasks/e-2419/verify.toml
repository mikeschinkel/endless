# ── DO NOT EDIT ─────────────────────────────────────────────────────
# This suite belongs to E-2419 and records what was true when E-2419
# landed. Edit it only if you ARE E-2419. If your change breaks a check
# here, leave it alone — see .endless/tasks/CLAUDE.md.
#
# E-2419 made verify.toml the suite form in all advice, added `sh` checks with
# `name` and output matchers, and made the CTRF report validate against CTRF
# v0.2.0.
#
# This manifest uses only keys main's runner already knows: E-2419 is the task
# that adds `name`, `sh` and the matchers, and `endless task verify` runs it
# with main's runner, which would refuse them. So the text checks are a TAP
# script beside this file (checks.sh) rather than `sh` checks. The Go tests
# below compile this worktree's code, so they prove the new keys themselves.

schema = 1
task   = "E-2419"

# The manifest schema, the shell driver, its matchers and validation, the CTRF
# shape and its schema validation (internal/verify); the runner end to end —
# a check's name labelling its report, a failing sh check's output, as/tmux
# (internal/verifycmd); the rendered handoff (internal/templatecmd).
[[check]]
runner = "gotest"
paths  = ["./internal/verify/...", "./internal/verifycmd/...", "./internal/templatecmd/..."]

# SUITE_RULES teaches the manifest form only, and the repo's own
# .endless/tasks/CLAUDE.md is that text.
[[check]]
runner = "pytest/uv"
paths  = ["tests/test_suite_rules.py"]

# The guide, the _harness.sh header, the mirror wording, and this suite's form.
[[check]]
runner  = "sh"
command = 'sh "$ENDLESS_VERIFY_DIR/checks.sh"'
format  = "tap"
