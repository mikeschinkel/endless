[[item]]
id = "P1"
kind = "deliverable"
statement = "A verify.toml [[check]] with an `sh` key runs that command at the worktree root under the run's isolation; exit 0 passes and anything else fails"
verify = "internal/verify and internal/verifycmd tests"

[[item]]
id = "P2"
kind = "deliverable"
statement = "Any [[check]] may carry `name`, and the run's report labels that check's result with it"
