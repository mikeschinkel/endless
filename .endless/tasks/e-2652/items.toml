# Plan items for E-2652: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2652 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "A console project window's second status row shows the project's name and code, then its backlog, working, needs-input and unverified counts, in the form `endless (E) · backlog 42 · working 2 · needs input 1 · unverified 7`"
verify = "Go test of the console renderer's output against a seeded project"

[[item]]
id = "P2"
kind = "deliverable"
statement = "A project with no project code shows its name alone, with no empty parentheses"
verify = "Go test of the console renderer"

[[item]]
id = "P3"
kind = "deliverable"
statement = "The backlog count is the project's tasks not in a terminal status, as ED-1674 defines Total Backlog, and it includes tasks in every non-terminal status"
verify = "Go test seeding one task in each status"

[[item]]
id = "P4"
kind = "deliverable"
statement = "The working and needs-input counts include only live sessions of the window's project, in the working and needs_input states respectively"
verify = "Go test with sessions in two projects and in other states"

[[item]]
id = "P5"
kind = "deliverable"
statement = "The unverified count is the window's project's tasks in status unverified"
verify = "Go test with unverified tasks in two projects"

[[item]]
id = "P6"
kind = "deliverable"
statement = "A window opened by OpenProjectWindow carries the window options @endless_window_type=project and @endless_project=<project name>"
verify = "Go test against a private tmux server"

[[item]]
id = "P7"
kind = "deliverable"
statement = "A console window that is not a project window shows the dim placeholder dot on its second status row"
