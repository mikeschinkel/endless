# Plan items for E-2463: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2463 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "The handoff a spawned session receives names .endless/tasks/e-<id>/verify.toml as its suite and does not mention verify.sh or _harness.sh"
verify = "a template test in internal/templatecmd"

[[item]]
id = "P2"
kind = "deliverable"
statement = "endless guide orchestration and endless guide reference present verify.toml as the suite format, naming verify.sh only as a legacy format the runner still runs"
verify = "grep of docs/guide for verify.sh shows only the legacy mentions"

[[item]]
id = "P3"
kind = "deliverable"
statement = "The text of .endless/tasks/CLAUDE.md describes verify.toml as the suite format, with an example using as = \"agent\" and tmux = true"
verify = "a Go test on the embedded text"

[[item]]
id = "P4"
kind = "deliverable"
statement = "The file opens with a note that Endless may overwrite local changes and that anyone needing to keep them should open a GitHub issue explaining why"
verify = "a Go test on the embedded text"

[[item]]
id = "P5"
kind = "deliverable"
statement = "endless project init writes .endless/tasks/CLAUDE.md, overwriting a copy whose bytes differ"
verify = "a test in tests/"

[[item]]
id = "P6"
kind = "deliverable"
statement = "A recurring runner job writes .endless/tasks/CLAUDE.md into every registered project where it is missing or differs, and commits it on that project's main checkout"
verify = "a Go test with two registered projects, one missing the file and one with a stale copy"

[[item]]
id = "P7"
kind = "deliverable"
statement = "A hook refuses creating .endless/tasks/e-<id>/verify.sh, by Write or a recognized Bash write, when the main checkout has no verify.sh for that task, naming verify.toml instead"
verify = "a Go test in internal/hookcmd"

[[item]]
id = "P8"
kind = "deliverable"
statement = "Editing an existing verify.sh of one's own task, and writing a verify.toml, are not refused"
verify = "a Go test in internal/hookcmd"

[[item]]
id = "P9"
kind = "exclusion"
statement = "Does not remove the runner's support for running verify.sh"

[[item]]
id = "P10"
kind = "exclusion"
statement = "Does not ship _harness.sh or _guard.sh to other projects"

[[item]]
id = "P11"
kind = "exclusion"
statement = "Does not convert any existing verify.sh suite to verify.toml"

[[item]]
id = "P12"
kind = "exclusion"
statement = "Adds no per-project override that stops Endless overwriting the file"
