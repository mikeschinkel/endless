[[item]]
id = "P1"
kind = "deliverable"
statement = "session goto, show, cd, use, back and history find a live session named by id in any project"

[[item]]
id = "P2"
kind = "deliverable"
statement = "Finding the current window's session with no id given works in any project"

[[item]]
id = "P3"
kind = "deliverable"
statement = "The --rebind guard sees a live session on the task whatever project the session is in"

[[item]]
id = "P4"
kind = "deliverable"
statement = "A live session's worktree path comes from its own project, not the cwd's"

[[item]]
id = "P5"
kind = "deliverable"
statement = "goto and background resume act in the session's own project and worktree"

[[item]]
id = "P6"
kind = "deliverable"
statement = "Claiming or binding a task sets the session's project to the task's project"

[[item]]
id = "P7"
kind = "deliverable"
statement = "The hook's auto-bind from a worktree sets the session's project from the task"

[[item]]
id = "P8"
kind = "deliverable"
statement = "A session with no task keeps the project it was created with, and a release leaves it unchanged"

[[item]]
id = "P9"
kind = "deliverable"
statement = "A migration sets every existing session with a task to that task's project"

[[item]]
id = "P10"
kind = "deliverable"
statement = "Listings with no id, such as session list, keep the cwd's project scope"

[[item]]
id = "P11"
kind = "exclusion"
statement = "Storing the project a session started in; session_tasks already records it"

[[item]]
id = "P12"
kind = "exclusion"
statement = "A search-on-miss fallback naming a --project flag; no by-id lookup stays scoped"

[[item]]
id = "P13"
