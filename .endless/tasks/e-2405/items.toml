# Plan items for E-2405: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2405 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "endless task spawn E-N creates the task's worktree in the task's own project repository, and starts the session there, no matter the directory it is run from"
verify = "a test in tests/ with two registered projects, run from the first"

[[item]]
id = "P2"
kind = "deliverable"
statement = "The events spawn emits before launch (the status change and the worktree) carry the task's project, not the current directory's"
verify = "a test in tests/ reading the emitted events"

[[item]]
id = "P3"
kind = "deliverable"
statement = "The post-worktree-create hook that spawn and prime run is the task's project's, never the current directory's project's"
verify = "a test in tests/ with a marker hook in each project"

[[item]]
id = "P4"
kind = "deliverable"
statement = "endless task prime E-N creates the task's worktree in the task's own project repository"
verify = "a test in tests/"

[[item]]
id = "P5"
kind = "deliverable"
statement = "endless task claim E-N of a task belonging to a project other than the one it is run in refuses, changes nothing, and names endless task spawn E-N"
verify = "a test in tests/ checking status, worktrees and events are unchanged"

[[item]]
id = "P7"
kind = "deliverable"
statement = "endless session goto --resume recreates a dropped worktree in the task's own project repository"
verify = "a test in tests/"

[[item]]
id = "P8"
kind = "deliverable"
statement = "endless task unsettled E-N inspects the worktree in the task's own project repository"
verify = "a test in tests/"

[[item]]
id = "P9"
kind = "deliverable"
statement = "When the task's project is not the current directory's, spawn and prime print the task's project above the worktree line"
verify = "a test in tests/ on the output"

[[item]]
id = "P10"
kind = "deliverable"
statement = "When the task's project has no registered path, or the path is not a directory, spawn, prime, claim, session goto --resume and task unsettled E-N refuse before changing anything and name the project and the path"
verify = "a test in tests/"

[[item]]
id = "P11"
kind = "deliverable"
statement = "E-2208's task.status_changed (submitted to underway) is in go-cfgstore's ledger tagged go-cfgstore and no longer in endless's ledger, and a rebuild of each project's database gives E-2208 the status history it has now"

[[item]]
id = "P12"
kind = "exclusion"
statement = "Does not change task unsettled --all, worktree list or any other command that surveys the current directory's project"

[[item]]
id = "P14"
kind = "exclusion"
statement = "Does not make the tasks a session spawned appear as rows in that session's status"
