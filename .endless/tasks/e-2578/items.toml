# Plan items for E-2578: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2578 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "event emit runs every apply inside a BEGIN IMMEDIATE transaction opened before any ledger write"
verify = "go test ./internal/events/... ./internal/eventcmd/..."
detail = "events.Execute and the id-allocating create path alike; no deferred db.Begin() remains on the emit path."

[[item]]
id = "P2"
kind = "deliverable"
statement = "The ledger line is appended after the apply's SQL has run and before the database COMMIT, in the same transaction"
verify = "a test whose apply SQL fails shows no new ledger line"
detail = "Order: BEGIN IMMEDIATE, run SQL, append primary line, append derived lines, COMMIT, then commit the segment to git."

[[item]]
id = "P3"
kind = "deliverable"
statement = "An apply whose SQL fails leaves no line on the ledger and no change in the database, and emit exits non-zero with the apply's error"

[[item]]
id = "P4"
kind = "deliverable"
statement = "epic.status_derived lines are appended inside the apply's transaction, after the primary line and before COMMIT"

[[item]]
id = "P5"
kind = "deliverable"
statement = "A new event kind ledger.voided exists whose payload names the segment, the byte offset of every line in the voided run, and the error that stopped the apply"
detail = "Refs are byte offsets in the named segment, the form ledger.corrected already uses; the segment is named because a run and its voiding can straddle a rotation."

[[item]]
id = "P6"
kind = "deliverable"
statement = "When the ledger append succeeded and the database COMMIT then failed, emit appends a ledger.voided line covering the whole run, commits the segment, and exits non-zero"
verify = "a test that fails the COMMIT shows the run followed by one ledger.voided line naming each of its offsets"
detail = "The voided line is written with no database access; its actor is the actor of the voided event."

[[item]]
id = "P7"
kind = "deliverable"
statement = "On that failure the user sees the apply's error and a line saying the ledger holds the entry and its voiding, never that nothing was recorded"

[[item]]
id = "P8"
kind = "deliverable"
statement = "The projector reads ledger.voided lines before replaying and skips every line whose segment and offset one of them names, counting the skipped lines in the projection result"
verify = "go test ./internal/events/... (projector test with a voided run)"

[[item]]
id = "P9"
kind = "deliverable"
statement = "ReadAllEvents gives each event its segment name and byte offset so the projector can match a void to its lines"

[[item]]
id = "P10"
kind = "deliverable"
statement = "event emit refuses ledger.voided from the command line, as it refuses ledger.row_changed and ledger.corrected"

[[item]]
id = "P11"
kind = "deliverable"
statement = "endless-go event void <segment> --offset <n> [--offset <n>...] --reason <text> appends a ledger.voided line for lines already on the ledger, user-only, refused to an agent, and commits the segment"
detail = "Go-only, no Python surface; the one positional is the segment. It exists for repair of a run that emit itself could not void."

[[item]]
id = "P12"
kind = "deliverable"
statement = "The task.landed line for E-2486 at ledger segment a7f3-000029 (commit 596574b51) is voided on main with a ledger.voided line whose reason names this task"

[[item]]
id = "P13"
kind = "deliverable"
statement = "A decision is filed restating the invariant: a committed database change always has its ledger line, and a ledger line whose apply did not commit is voided"

[[item]]
id = "P14"
kind = "deliverable"
statement = "The guide describes the emit order, the ledger.voided entry, and event void, in the appendix section that documents the ledger"

[[item]]
id = "P15"
kind = "deliverable"
statement = "Go tests cover: SQL failure leaves nothing; COMMIT failure writes a void covering derived lines; the projector skips voided lines; event void refuses an agent"

[[item]]
id = "P16"
kind = "exclusion"
statement = "Does not add a retry loop: the busy_timeout wait under BEGIN IMMEDIATE is the only waiting"

[[item]]
id = "P17"
kind = "exclusion"
statement = "Does not detect a run orphaned by a crash between append and COMMIT; that is E-914's repair"

[[item]]
id = "P18"
kind = "exclusion"
statement = "Does not change the endless correct path, the rebuild-db refusal, or the payload of any existing event kind"

[[item]]
id = "P19"
kind = "exclusion"
statement = "Does not re-apply the E-2486 task.landed line or insert a task_landings row for it"

[[item]]
id = "P20"
kind = "deliverable"
statement = "A git failure after a successful apply records WARN-0038 ledger-uncommitted and exits zero, instead of failing a command that took effect"
