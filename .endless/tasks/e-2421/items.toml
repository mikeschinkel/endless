[[item]]
id = "P1"
kind = "deliverable"
statement = "Re-running `endless project init` replaces a project's .endless/tasks/CLAUDE.md with the rules this Endless ships when the file is exactly what init last wrote into that project"

[[item]]
id = "P2"
kind = "deliverable"
statement = "When init has no record for the project, it replaces the file only if it is exactly some version Endless has shipped"

[[item]]
id = "P3"
kind = "deliverable"
statement = "Otherwise init leaves the file alone and says it was edited locally and not updated"

[[item]]
id = "P4"
kind = "deliverable"
statement = "What init wrote into a project is recorded in that project's own history, so a clone of the project knows it too"

[[item]]
id = "P5"
kind = "deliverable"
statement = "Every install of Endless knows each version of the file it has shipped, with no download or setup"

[[item]]
id = "P6"
kind = "deliverable"
statement = "The record of shipped versions can later hold other kinds of shipped file, not just this one"

[[item]]
id = "P7"
kind = "deliverable"
statement = "A test fails when the endless repo's committed .endless/tasks/CLAUDE.md differs from SUITE_RULES"

[[item]]
id = "P8"
kind = "deliverable"
statement = "In the endless repo, running init from a task's worktree records into that worktree's sandbox database, not the main one"
