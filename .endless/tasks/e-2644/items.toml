# Plan items for E-2644: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2644 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "A Go function in internal/tmuxservers reports whether the calling process's pane is on the task-session server, false with $TMUX unset or the server down, behind a seam tests pin"

[[item]]
id = "P2"
kind = "deliverable"
statement = "liveSessionByProcessTx scopes the pane to the task-session server's identity and matches only when the caller's pane is on that server; otherwise it matches nothing, as it does today with no identifiable server"
verify = "internal/events/session_status_test.go"

[[item]]
id = "P3"
kind = "deliverable"
statement = "session touch, session snapshot add, session task add and session task delete take the override as --session N only; --session-id is removed from them and every caller and test that passed it to one of them is updated, with a repo-wide search showing none left"
verify = "endless session touch --help"

[[item]]
id = "P4"
kind = "deliverable"
statement = "Before auto-spawn or triage starts a session, the attached-terminal check asks the task-session server by socket path and skips with the existing note when no terminal is attached to it"
verify = "internal/autospawnjob/autospawnjob_test.go"

[[item]]
id = "P5"
kind = "deliverable"
statement = "The auto_spawn.target setting is gone: endless-go settings list does not show it, a config that still names it loads unchanged, spawn-window no longer takes --target-session, and the auto-spawn job no longer passes one"

[[item]]
id = "P6"
kind = "deliverable"
statement = "_tmux_window_pane_ids, _window_claimed_task and _live_window_claiming use the caller's pane only when the caller is in the task-session server, and answer as outside tmux otherwise"
verify = "tests/test_session_goto_back.py"

[[item]]
id = "P7"
kind = "deliverable"
statement = "session resume --tmux-session and --all-tmux-sessions address the task-session server by socket; with it down they refuse with the not-running message and do nothing"
verify = "internal/resumewindowscmd/resumewindows_test.go"

[[item]]
id = "P8"
kind = "deliverable"
statement = "The guide's auto-spawn section names the task-session server's tasks session as where the window opens, the attached-terminal rule, and no longer mentions auto_spawn.target"
verify = "grep -c 'auto_spawn.target' docs/guide/reference.md = 0"

[[item]]
id = "P9"
kind = "exclusion"
statement = "Does not change how a Claude hook binds its pane or which server it records (E-2572)"

[[item]]
id = "P10"
kind = "exclusion"
statement = "Does not touch the other sites in E-2572's analysis that use the caller's server: tmux apply and init, status-line, show-menu, the monitors' pane work, spawn-launch, task_cmd._tmux_window_session_uuid, liveness observation"

[[item]]
id = "P11"
kind = "exclusion"
statement = "Does not change which server or session a spawn, resume or auto-spawn window opens in"
