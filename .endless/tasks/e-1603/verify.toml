# Verification suite for E-1603 — the `endless verify` Tier-0 runner.
#
# Reference exemplar for a multi-runner suite (E-1596/E-1605): a first-class
# `gotest` check over the runner's own Go packages, plus a raw `sh` check whose
# TAP output drives the runner end to end against throwaway fixtures. Both
# normalize and MERGE into one CTRF report — the first real proof of
# discover -> isolate -> capture -> normalize -> merge with more than one runner.
#
schema = 1
task   = "E-1603"

# Unit tests for the runner and its manifest/normalizer dependencies.
[[check]]
runner = "gotest"
paths  = ["./internal/verify/...", "./internal/verifycmd/..."]

# End-to-end TAP check: drives endless-go verify against passing/failing/unknown
# fixture suites and asserts the pass/fail summary and exit-code contract.
#
# $ENDLESS_VERIFY_DIR is this task's own suite directory, exported by the
# runner. It used to be typed out as ".endless/tasks/E-1603/", which resolved
# only because APFS is case-insensitive — the directory on disk is "e-1603".
[[check]]
runner  = "sh"
command = "sh \"$ENDLESS_VERIFY_DIR\"/e2e.sh"
format  = "tap"

# pytest first-class check (the pytest/uv showcase): the Python `task verify`
# wrapper's unit tests. The pytest/uv driver (ED-1536) resolves the project venv's
# pytest, runs with --json-report, and normalizes the plugin's document to CTRF —
# merging into this suite's one report alongside the gotest and TAP checks.
[[check]]
runner = "pytest/uv"
paths  = ["tests/test_verify_cmd.py"]
