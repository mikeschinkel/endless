# Plan items for E-2353: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2353 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "render_items lays plan items out as a three-column table with no headings: item number, glyphs, text"
verify = "tests/test_plan_items.py"
detail = "Built with tabulate's borderless format and per-column wrap width, the library every other CLI table uses."

[[item]]
id = "P2"
kind = "deliverable"
statement = "The text cell holds the statement, then verify: and its text, then the detail, wrapped as one block within the column"

[[item]]
id = "P3"
kind = "deliverable"
statement = "The table is laid out to the terminal width when it can be read and to 70 columns when it cannot"

[[item]]
id = "P4"
kind = "deliverable"
statement = "The number column is as wide as the widest item label present, so the text column starts at the same offset for P9, P10 and P100"

[[item]]
id = "P5"
kind = "deliverable"
statement = "One blank line separates items"

[[item]]
id = "P6"
kind = "deliverable"
statement = "The glyph cell has three fixed slots: state (✓ approved, blank unapproved, ~ changed since approval, – withdrawn), origin (+ grown, ↷ post-land, blank planned), kind (✗ exclusion, blank deliverable)"
detail = "Fixed slots keep the column aligned; a blank slot is the common case."

[[item]]
id = "P7"
kind = "deliverable"
statement = "The glyph map is defined once in plan_items and a static legend line, dim, is printed under the table wherever it renders, as session list prints its state legend"

[[item]]
id = "P8"
kind = "deliverable"
statement = "After reconciliation the verdict line, the EQ question line and the kept: line render inside the item's text cell, indented under its text"

[[item]]
id = "P9"
kind = "deliverable"
statement = "Every view that calls render_items shows the table and legend: task plan list, task show, the reconcile context and the post-land state"

[[item]]
id = "P10"
kind = "deliverable"
statement = "--json and agent output of task plan list and task show are unchanged"

[[item]]
id = "P11"
kind = "deliverable"
statement = "Tests cover: wrapping within the text column at a given width, each glyph slot, the legend under the table, and a label wider than two characters"
verify = "tests/test_plan_items.py"

[[item]]
id = "P12"
kind = "deliverable"
statement = "The guide's Plan items section shows the glyph legend in one line"

[[item]]
id = "P13"
kind = "exclusion"
statement = "Does not draw borders or dividing lines"

[[item]]
id = "P14"
kind = "exclusion"
statement = "Does not replace tabulate with rich; that is E-720"

[[item]]
id = "P15"
kind = "exclusion"
statement = "Does not change plan-item data, events, or the items.toml mirror"
