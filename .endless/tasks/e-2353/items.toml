# Plan items for E-2353: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2353 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "render_items lays plan items out as a headerless table: item number, three one-character glyph columns with no gap between them (state, origin, kind), then text"
verify = "tests/test_plan_items.py"
detail = "Built with tabulate's borderless format and per-column wrap width, the library every other CLI table uses."

[[item]]
id = "P2"
kind = "deliverable"
statement = "The text cell holds the statement, then 'Verify: <verify>' and 'Detail: <detail>' each on its own labeled line in bright cyan; for every label (Verify:, Detail:, Verdict:, Answer:, Question:, Answer holds:) the text sits on the label's line when label and text fit on one line, otherwise it starts on the next line indented three spaces under the label"
verify = "tests/test_plan_items.py"
detail = "Supersedes the merged block the first version rendered, where verify: read as part of the statement."

[[item]]
id = "P3"
kind = "deliverable"
statement = "The table is laid out to the terminal width when it can be read and to 70 columns when it cannot"

[[item]]
id = "P4"
kind = "deliverable"
statement = "The number column is as wide as the widest item label present, so the text column starts at the same offset for P9, P10 and P100"

[[item]]
id = "P5"
kind = "deliverable"
statement = "One blank line separates items"

[[item]]
id = "P6"
kind = "deliverable"
statement = "The three glyph columns are fixed positions: state (✓ approved, blank unapproved, ~ changed since approval, – withdrawn), origin (+ grown, ↷ post-land, blank planned), kind (✗ exclusion, blank deliverable), so an unapproved grown deliverable reads ' + '"
detail = "Fixed slots keep the column aligned; a blank slot is the common case."

[[item]]
id = "P7"
kind = "deliverable"
statement = "The glyph map is defined once in plan_items and a static dim legend prints under the table wherever it renders, between a dim box-drawing rule above and below it, each the width of the layout; the legend omits the blank values and reads 'changed' for changed since approval"

[[item]]
id = "P8"
kind = "deliverable"
statement = "After reconciliation, labeled lines render in the item's text cell under its text: 'Verdict: <verdict>', with '(post-land #N)' after the verdict when it came from a post-land reconcile; the entry's note indented three spaces under the verdict line; then 'Answer: <answer> (EQ-n)' for an answered question, 'Question: EQ-n open, waiting for the user' or 'Question: EQ-n closed, <reason>' otherwise; and 'Answer holds: <reason>' when an earlier answer was reaffirmed"
detail = "A fixed label sits left of each colon; variable text sits right of it. The note is the verdict's elaboration, shown whenever the entry has one, As planned included."

[[item]]
id = "P9"
kind = "deliverable"
statement = "Every view that calls render_items shows the table and legend: task plan list, task show, the reconcile context and the post-land state"

[[item]]
id = "P10"
kind = "deliverable"
statement = "--json and agent output of task plan list and task show are unchanged"

[[item]]
id = "P11"
kind = "deliverable"
statement = "Tests cover: wrapping within the text column at a given width, each glyph slot, the legend under the table, and a label wider than two characters"
verify = "tests/test_plan_items.py"

[[item]]
id = "P12"
kind = "deliverable"
statement = "The guide's Plan items section shows the glyph legend in one line"

[[item]]
id = "P13"
kind = "exclusion"
statement = "Does not draw borders or dividing lines"

[[item]]
id = "P14"
kind = "exclusion"
statement = "Does not replace tabulate with rich; that is E-720"

[[item]]
id = "P15"
kind = "exclusion"
statement = "Does not change plan-item data, events, or the items.toml mirror"

[[item]]
id = "P16"
kind = "deliverable"
statement = "One space separates the number column, the glyph cell and the text column; the blank slots inside the glyph cell are the only other whitespace before the text"

[[item]]
id = "P17"
kind = "deliverable"
statement = "The table proper-cases the verdict words: As planned, Done differently, Not done, Blocked, Deferred to after the land, Kept, NOT KEPT"

[[item]]
id = "P18"
kind = "deliverable"
statement = "The labels Verdict:, Answer:, Question: and Answer holds: print in bright cyan, styled after the line is wrapped so the escape codes never count toward the width"
