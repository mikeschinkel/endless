[[item]]
id = "P1"
kind = "deliverable"
statement = "The gate's stale-reconciliation refusal names the commit the last reconciliation was made at, the current HEAD, and the files whose content differs between them"
verify = "go test ./internal/reconcilegate/..."
detail = "The file list is computed the way the reconcile context computes files_changed, so the user and the agent read the same list."

[[item]]
id = "P2"
kind = "deliverable"
