# Plan items for E-2490: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2490 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "A commit made on a task/NNNN branch, from any tool that runs Git hooks, carries an Endless-Task: E-NNNN trailer added by a prepare-commit-msg Git hook, and its E-NNNN: subject prefix is unchanged"

[[item]]
id = "P14"
kind = "deliverable"
statement = "endless git-hook prepare-commit-msg <message-file> [source] [sha] adds the trailer, and every setup path (lefthook entry, unmanaged hook file, the line given to husky and other managers' users) calls it"

[[item]]
id = "P2"
kind = "deliverable"
statement = "The Git hook adds nothing on any other branch or a detached HEAD, adds nothing when the message already has an Endless-Task trailer, and never exits non-zero"

[[item]]
id = "P3"
kind = "deliverable"
statement = "In a repo using lefthook, project init adds Endless's prepare-commit-msg command to lefthook-local.yml or to lefthook.yml, as a user setting chooses"

[[item]]
id = "P4"
kind = "deliverable"
statement = "Endless's command in a committed lefthook.yml does nothing when the endless command is not installed"

[[item]]
id = "P5"
kind = "deliverable"
statement = "In a repo with no hook manager and no existing Git hooks, project init offers lefthook or no manager, answerable without a prompt by --git-hooks=lefthook|none; no manager writes prepare-commit-msg into the directory git rev-parse --git-path hooks names"

[[item]]
id = "P6"
kind = "deliverable"
statement = "In a repo with existing Git hooks and no hook manager, project init offers to move them into lefthook.yml, shows the resulting config, and runs lefthook install only if the user agrees"

[[item]]
id = "P7"
kind = "deliverable"
statement = "When the user chooses lefthook and it is not installed, project init says how to install it"

[[item]]
id = "P8"
kind = "deliverable"
statement = "In a repo using husky or another hook manager Endless does not support, project init completes and prints the exact line to add to that manager's prepare-commit-msg hook (for husky, naming .husky/prepare-commit-msg); when the user declines lefthook with Git hooks present, it completes without the trailer and says why"

[[item]]
id = "P9"
kind = "deliverable"
statement = "endless doctor reports a repo where task-branch commits will not get the trailer, including a husky repo whose .husky/prepare-commit-msg lacks the endless git-hook command, and reports that it cannot confirm the setup under other unsupported managers; a user setting turns these reports off"

[[item]]
id = "P10"
kind = "deliverable"
statement = "Endless never overwrites, renames or removes a Git hook file or a core.hooksPath setting it did not write"

[[item]]
id = "P11"
kind = "exclusion"
statement = "Does not edit husky's or any other unsupported hook manager's files"

[[item]]
id = "P12"
kind = "exclusion"
statement = "Does not add trailers to commits that already exist"

[[item]]
id = "P13"
kind = "exclusion"
statement = "Does not install lefthook itself; E-1852 covers installing Endless's prerequisites"

[[item]]
id = "P15"
kind = "deliverable"
statement = "endless git-hook commit-msg <message-file> adds the trailer after the editor closes; prepare-commit-msg leaves an editor commit (source empty or template) to it so an empty message still aborts the commit, and every setup path installs both hook entries"
