[[item]]
id = "P1"
kind = "deliverable"
statement = "Setting a task with plan items to `unverified` is refused while any active planned item is not approved as it stands, and the refusal names those items and the `endless task plan approve` command"
verify = "Go test in internal/reconcilegate, handover mode"

[[item]]
id = "P2"
kind = "deliverable"
statement = "An agent setting such a task straight to `assumed` is refused the same way"
verify = "Go test in internal/reconcilegate, handover mode with to=assumed"

[[item]]
id = "P3"
kind = "deliverable"
statement = "The refusal applies to a task none of whose items has ever been approved, including one whose first items were added while it was `underway`"
verify = "Go test: a task whose only items were added at underway and never approved is refused"

[[item]]
id = "P4"
kind = "deliverable"
statement = "A grown item whose reconciliation question the user has answered needs no separate approval"
verify = "Go test: grown items kept through an answered question pass the handover"

[[item]]
id = "P5"
kind = "exclusion"
statement = "`endless task verify` does not apply the approval check, so a task already at `unverified` with unapproved planned items verifies as it does today"

[[item]]
id = "P6"
kind = "exclusion"
statement = "`endless worktree land` gains no new check"

[[item]]
id = "P7"
kind = "exclusion"
statement = "Does not change when plan items freeze or what `revisit` unfreezes"

[[item]]
id = "P8"
kind = "deliverable"
statement = "The hand-in approval check does not apply to a move from a status whose items are already frozen (e.g. unverified → assumed), so a task already at unverified with unapproved items is not stranded"
