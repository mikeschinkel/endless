# Plan items for E-2571: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2571 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "A RenamedKinds map in internal/events declares each retired event spelling and the live kind that replaced it, and is the only place any rename is recorded"
verify = "the map names decision.deleted, task.deleted and session_tasks.removed, and no dual-spelling case remains in either dispatch switch"

[[item]]
id = "P2"
kind = "deliverable"
statement = "The executor and the projector both resolve an event's kind through RenamedKinds before dispatching, so neither switch can disagree with the other about a rename"
verify = "the explicit KindDecisionRemoved, KindDecisionDeleted cases E-2010 added are gone from both files, and go test ./internal/events/... passes"

[[item]]
id = "P3"
kind = "deliverable"
statement = "A test asserts every RenamedKinds key is in RetiredKinds and absent from ValidKinds, and every value is in ValidKinds"
verify = "the test fails when a key is left out of RetiredKinds, and when a value is not a live kind"

[[item]]
id = "P4"
kind = "deliverable"
statement = "task.removed is the only task-removal kind a live code path can emit, and task.deleted is refused by event emit while still validating"
verify = "endless-go event emit --kind task.deleted is refused; KnownKind accepts it"

[[item]]
id = "P5"
kind = "deliverable"
statement = "Replaying the task.deleted events already in the ledger still sets tasks.removed and retains every row, asserted under both spellings"
verify = "a projection test covering both spellings asserts the retained row and the unchanged id floor, and fails if either spelling stops reaching the removal handler"

[[item]]
id = "P6"
kind = "deliverable"
statement = "session_tasks.deleted is the only membership-deletion kind a live code path can emit, and replaying session_tasks.removed still deletes the membership row"
verify = "a test asserts the row is gone under both spellings"

[[item]]
id = "P7"
kind = "deliverable"
statement = "The command is endless session task delete, and session task remove no longer exists"
verify = "endless session task delete E-N works; endless session task remove is an unknown subcommand; just guide-check passes"

[[item]]
id = "P8"
kind = "deliverable"
statement = "Both Python emitters of task removal — task remove, and the per-task emit in project unregister — emit task.removed"
verify = "grep finds no task.deleted emit in src/endless, and endless task remove still removes a task end to end"

[[item]]
id = "P9"
kind = "deliverable"
statement = "The symbols that handle each kind are named for the kind they handle: the task executor, its replay function and its payload struct say removed, and the membership executor says deleted"
verify = "go build ./... passes and no symbol named for the old spelling remains"

[[item]]
id = "P10"
kind = "deliverable"
statement = "The guide and the in-code comments that name session task remove name session task delete instead"
verify = "grep finds no session task remove in docs/, src/ or internal/"

[[item]]
id = "P11"
kind = "deliverable"
statement = "TestValidKinds_Count's tally records this task's two additions and two retirements, and TestRetiredKinds' list names both newly retired spellings"
verify = "go test ./internal/events/... passes without changing the expected total"

[[item]]
id = "P12"
kind = "exclusion"
statement = "No column, view or migration change: tasks.removed and live_tasks already exist and already carry the right word"

[[item]]
id = "P13"
kind = "exclusion"
statement = "task_dep.deleted, decision_relation.deleted, project.unregistered and project.purged are left alone — the first two hard-delete junction rows with surrogate ids and the project kinds claim no delete"

[[item]]
id = "P14"
kind = "exclusion"
statement = "No alias and no deprecation path for the old command name"

[[item]]
id = "P15"
kind = "exclusion"
statement = "evt.Kind is not rewritten: normalization happens at dispatch, so refusals and anything rendering an event still name the spelling the ledger holds"

[[item]]
id = "P16"
kind = "exclusion"
statement = "What session task delete refuses, and its clearing of a hide on the same pair, are unchanged"
