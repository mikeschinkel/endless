# Plan items for E-2684: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2684 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "With the main checkout on its default branch, every Endless auto-commit (ledger segments, document mirrors, verify reports, lessons, matchers, project identity, materialized templates) still commits there as before"
verify = "go test ./internal/events/ and the existing Python suite"

[[item]]
id = "P2"
kind = "deliverable"
statement = "With the main checkout on another branch, each of those auto-commits lands on the default branch and the checked-out branch gets no commit"
verify = "Go tests in internal/events for a replace and an append with the main checkout on another branch"

[[item]]
id = "P3"
kind = "deliverable"
statement = "A commit made while the main checkout is on another branch applies its change to the default branch's copy of the file: an append keeps every line the default branch already had, and a replace leaves the file with exactly the new content"
verify = "Go tests in internal/events"

[[item]]
id = "P4"
kind = "deliverable"
statement = "A commit made while the main checkout is on another branch leaves that checkout's working tree and index unchanged"
verify = "Go test in internal/events comparing git status before and after"

[[item]]
id = "P5"
kind = "deliverable"
statement = "When another writer moves the default branch between reading its tip and update-ref, the commit retries and both writers' changes end up on the default branch"
verify = "Go test in internal/events"

[[item]]
id = "P6"
kind = "deliverable"
statement = "The default branch is the one monitor.DefaultBranch resolves, the same branch worktree land lands onto"

[[item]]
id = "P7"
kind = "deliverable"
statement = "Python's main_commit callers commit through endless-go's commit layer, so one implementation decides the branch"
verify = "grep finds no git commit invocation left in src/endless/main_commit.py"

[[item]]
id = "P8"
kind = "deliverable"
statement = "template render run from a task worktree whose project lacks a template creates no commit on the task branch, and the template is committed on the default branch"
verify = "templatecmd test rendering from a worktree"

[[item]]
id = "P9"
kind = "deliverable"
statement = "template render run from a worktree renders from that worktree's templates, falling back to the embedded template where the worktree lacks the file"
verify = "templatecmd test"

[[item]]
id = "P10"
kind = "deliverable"
statement = "task spawn renders the handoff from the spawned task's project, so spawning a task of project B from project A's worktree materializes nothing in A"
verify = "Python test of _render_handoff"

[[item]]
id = "P11"
kind = "exclusion"
statement = "Does not change where Endless reads its ledger, mirrors, lessons or templates from"

[[item]]
id = "P12"
kind = "exclusion"
statement = "Does not change commits Endless deliberately makes on a worktree branch, such as register's worktree-rules commit"

[[item]]
id = "P13"
kind = "exclusion"
statement = "Does not repair stray auto-commits already sitting on task branches"
