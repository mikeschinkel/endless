# Plan items for E-2357: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2357 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "The session status graph shows the session's own task at every status, landed or not; the graph never removes it"
verify = "go test ./internal/sessionstatuscmd/ -run 'TestGraph|TestGraphSeeds'"

[[item]]
id = "P2"
kind = "deliverable"
statement = "Every id in the graph draws dim when its task has a landing record or a terminal status (confirmed, assumed, completed, declined, obsolete, superseded), and bright otherwise, in-flight included"
verify = "go test ./internal/sessionstatuscmd/ -run TestGraph"

[[item]]
id = "P3"
kind = "deliverable"
statement = "Every occurrence of one id in the graph draws at the same intensity; a repeated id is never dimmed for being repeated"
verify = "go test ./internal/sessionstatuscmd/ -run TestGraph"

[[item]]
id = "P4"
kind = "deliverable"
statement = "Each graph node carries a landings count, the number of landing records its task has, and session status --json emits it as a landings field on each node"
verify = "endless session status --json | jq '.graph.nodes[0].landings | type == \"number\"'"

[[item]]
id = "P5"
kind = "deliverable"
statement = "The graph tests cover a landed own task drawn dim, a completed brainstorm own task drawn dim, a bright own task unchanged, and a repeated id drawn alike on every line; the test asserting that repeats dim is gone"

[[item]]
id = "P6"
kind = "deliverable"
statement = "The header comment of graphSeeds and lineSegments, and the 'Which tasks appear' paragraph of docs/guide/sessions.md, state the new rule in the user's terms: your own task always appears and dims once landed or terminal"

[[item]]
id = "P7"
kind = "exclusion"
statement = "Does not change which rows other than the own task the graph starts from"

[[item]]
id = "P8"
kind = "exclusion"
statement = "Does not change the table's row dimming (rowIntensity) or the predecessor query in monitor.SessionGraphData"

[[item]]
id = "P9"
kind = "exclusion"
statement = "Does not touch the monitor dimming of rows stewarded elsewhere and blocker lines (the related monitor task)"
