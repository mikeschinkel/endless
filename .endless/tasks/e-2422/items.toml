[[item]]
id = "P1"
kind = "deliverable"
statement = "The executor writes session_notices for every task status, phase, complexity and risk change, with the same before/after JSON the tasks_notify_sessions trigger writes today"

[[item]]
id = "P2"
kind = "deliverable"
statement = "The executor writes session_notices for plan, analysis and notes changes with the '…' elision, merged into the same notice as a task-row change made by the same edit"

[[item]]
id = "P3"
kind = "deliverable"
statement = "The executor writes a 'landed' session notice for each landing, suppressed for the agent that landed it and sent to every holder when a person landed it"

[[item]]
id = "P4"
kind = "deliverable"
statement = "Notices are suppressed for the session that made the change, and never written to sessions in state 'ended'"

[[item]]
id = "P5"
kind = "deliverable"
statement = "A description edit writes no notice"

[[item]]
id = "P6"
kind = "deliverable"
statement = "The five triggers tasks_notify_sessions, task_content_notify_insert, task_content_notify_update, task_content_notify_delete and task_landings_notify_sessions no longer exist in schema.sql or in a migrated database"
detail = "Dropped through a new goose migration"

[[item]]
id = "P7"
kind = "deliverable"
statement = "The tests that covered the triggers' behaviour pass against the executor path"

[[item]]
id = "P8"
kind = "exclusion"
statement = "Does not change the session_notices table, how notices are drained and delivered, or the ledger event format"

[[item]]
id = "P9"
kind = "deliverable"
statement = "tasks.changed_by_session and the stampTaskActor write are dropped: the executor derives the notice actor from the event envelope"

[[item]]
id = "P10"
kind = "deliverable"
statement = "A notice write that fails after the task change committed records fault WARN-0036 (session-notices-unwritten) rather than failing the command"
