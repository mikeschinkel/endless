# Plan items for E-2010: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2010 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "The automatic disk-gone project sweep retains the project row instead of deleting it, so its tasks, activity, notes and deps are not cascaded away"
verify = ".endless/tasks/e-2010/verify.toml"
detail = "endless.project_sync's DELETE FROM projects is the last automatic hard delete of a project; it is the mechanism that cost 195 sessions and 1,616 activity rows."

[[item]]
id = "P2"
kind = "deliverable"
statement = "Clearing an ignored directory refuses to delete the project row while any session, activity row, note or dep still refers to it, not only while it has tasks"
verify = ".endless/tasks/e-2010/verify.toml"
detail = "monitor.ClearIgnoredDirectory counts tasks only, so a project with sessions but no tasks is deleted and cascades them."

[[item]]
id = "P3"
kind = "deliverable"
statement = "decisions carries a removed column declared last, and a live_decisions view, both added by a goose migration that applies to a database predating the column"
verify = ".endless/tasks/e-2010/verify.toml"
detail = "Declared last so ALTER TABLE's append position matches schema.sql for rebuild-db's INSERT ... SELECT *."

[[item]]
id = "P4"
kind = "deliverable"
statement = "Removing a decision sets removed = 1 and drops the relations it sources, through one function the executor and the projector both call, so rebuilding from the ledger never re-frees the id"
verify = ".endless/tasks/e-2010/verify.toml"
detail = "decision_relations.source_decision_id was ON DELETE CASCADE and an UPDATE fires no FK action, so those rows are deleted explicitly; their surrogate ids are the class ED-1547 leaves unrestricted."

[[item]]
id = "P5"
kind = "deliverable"
statement = "The decision id allocator still reads decisions, never live_decisions, so MAX(id) keeps counting past a removed row"
verify = ".endless/tasks/e-2010/verify.toml"

[[item]]
id = "P6"
kind = "deliverable"
statement = "Every read that lists or looks up decisions reads live_decisions, and every write path and the allocator read decisions, with the rule written down beside the view"
verify = ".endless/tasks/e-2010/verify.toml"

[[item]]
id = "P7"
kind = "deliverable"
statement = "No eager reference to the new column exists in schema.sql: the view body only, never an index, CHECK or generated column"
verify = ".endless/tasks/e-2010/verify.toml"
detail = "A view body resolves at PREPARE time, those resolve at CREATE time and would abort the migration against a database predating the column. This is what killed the first land attempt of the tasks half."

[[item]]
id = "P8"
kind = "exclusion"
statement = "Does not give sessions a removed column, a live view or a read-path audit"
detail = "82 non-test read sites across 36 files, for an entity nothing removes today. Filed as its own task, which this one should precede."

[[item]]
id = "P9"
kind = "exclusion"
statement = "Does not add a removed column to projects, and leaves the status-based live_projects view and the forget tombstone as they are"
detail = "status = forgotten already means what removed = 1 means, but status = ignored does not: the directory-to-project resolver has to find the ignored row, because being found is what stops auto-registration. Projects are machine-specific and are heading for their own database."

[[item]]
id = "P10"
kind = "exclusion"
statement = "Does not add a command that removes a decision"
detail = "No such path exists today, and the one that will reach it first is the correct command's delete, which already soft-removes on any table carrying a removed column."

[[item]]
id = "P11"
kind = "deliverable"
statement = "Removing a decision emits decision.removed, with decision.deleted retired rather than dropped so replay still accepts the events already in the ledger"
verify = ".endless/tasks/e-2010/verify.toml"
detail = "events.RetiredKinds already exists for this: add the new kind to ValidKinds, move the old one to RetiredKinds, and have the projector dispatch both into the one removal function. ED-1547 reserves 'removed' for a retained row and 'deleted' for a row that is really gone, so the new behavior must not ship under the old word."
