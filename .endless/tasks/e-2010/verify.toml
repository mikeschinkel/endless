# ── DO NOT EDIT ─────────────────────────────────────────────────────
# This suite belongs to E-2010 and records what was true when E-2010
# landed. Edit it only if you ARE E-2010. If your change breaks a check
# here, leave it alone — see .endless/tasks/CLAUDE.md.
#
# E-2010 finishes ED-1547 for projects and decisions: no id that anything
# outside its own row refers to is ever reused, so removal retains the row.
# Two halves, independent:
#
#   - the automatic disk-gone project sweep no longer hard-deletes a project
#     row and cascades its tasks, decisions, activity and notes away, and
#     `project unignore` refuses while ANY table still refers to the row
#     rather than only while it has tasks;
#   - decisions gain `removed`, `live_decisions`, one shared removal path the
#     executor and the projector both call, and the event name ED-1547's own
#     vocabulary calls for.
schema = 1
task   = "E-2010"

# ── Native tests first, fail-fast ───────────────────────────────────

[[check]]
name   = "events: decision removal parity and the kind rename"
runner = "gotest"
paths  = ["./internal/events/..."]

[[check]]
name   = "schema: the migration and schema.sql agree"
runner = "gotest"
paths  = ["./internal/schema/..."]

[[check]]
name   = "monitor: the project_unignore guard"
runner = "gotest"
paths  = ["./internal/monitor/..."]

[[check]]
name   = "python: the project sweep retains and revives"
runner = "pytest"
paths  = ["tests/test_project_sync.py", "tests/test_ignored_projects.py", "tests/test_decision_cmd.py"]

# ── The schema is actually shaped this way ──────────────────────────
# Asserted against the TREE, not against a database a binary built. The
# earlier version of this section ran `endless sql`, which reaches the
# INSTALLED endless — built from main, without this change — so it reported
# `updated_at` as the last column of `decisions` and could not have passed
# until after the land it was supposed to gate. A pre-land check may only
# look at what the branch contains.
#
# Nothing is lost by it. The behaviour those queries were reaching for — the
# removed row retained, invisible through the view, and still flooring the id
# allocator — is asserted by TestProjectToTempDB_DecisionRemovalRetainsRowAndIDFloor
# in the first check above, against a database built from these very
# migrations; and TestMigrate_MatchesSchemaSQL proves the migration and
# schema.sql agree, so asserting a fact in one asserts it in both.

[[check]]
name     = "removed is the last column of decisions in schema.sql"
sh       = "awk '/^CREATE TABLE IF NOT EXISTS decisions/,/^\\);/' internal/schema/schema.sql | grep -E '^    [a-z_]+ ' | tail -1"
contains = "removed INTEGER NOT NULL DEFAULT 0"

[[check]]
name     = "live_decisions is declared and filters on removed"
sh       = "awk '/^CREATE VIEW IF NOT EXISTS live_decisions/,/;/' internal/schema/schema.sql"
contains = "WHERE removed = 0"

[[check]]
name     = "the migration adds both, and is registered"
sh       = """
m=internal/schema/migrations/00031_decisions_removed.go
grep -q 'ALTER TABLE decisions ADD COLUMN removed INTEGER NOT NULL DEFAULT 0' "$m" || { echo "FAIL: the migration does not add decisions.removed"; exit 1; }
grep -q 'CREATE VIEW IF NOT EXISTS live_decisions' "$m" || { echo "FAIL: the migration does not create live_decisions"; exit 1; }
grep -q 'WHERE removed = 0' "$m" || { echo "FAIL: the migration's view does not filter on removed"; exit 1; }
grep -q 'decisionsRemoved(),' internal/schema/migrations/migrations.go || { echo "FAIL: migration 31 is not registered, so no existing install runs it"; exit 1; }
echo ok
"""
contains = "ok"

# ── No hard delete of either entity is left on a live path ──────────
# Greps, deliberately: the point is that the STATEMENT is gone, which no
# behavioural test can assert. Scoped to the paths that run, excluding the
# rebuild-scoped wipe in eventcmd (a scoped clear before replay, not an
# entity removal) and this suite itself.

[[check]]
name   = "nothing on a live path deletes a decision row"
sh     = "! grep -rn 'DELETE FROM decisions' internal/events/ src/endless/ 2>/dev/null"

[[check]]
name   = "the automatic project sweep does not delete a project row"
sh     = "! grep -n 'DELETE FROM projects' src/endless/project_sync.py 2>/dev/null"

[[check]]
name     = "the sweep retires the row through the registry instead"
sh       = "grep -c 'project_registry(\"ignore\"' src/endless/project_sync.py"
contains = "1"

# ── The reads that must NOT move, and the ones that must ────────────

[[check]]
name     = "the decision allocator still reads the table, not the view"
sh       = "grep -n 'MAX(id), 0) + 1 FROM decisions' internal/events/executor.go"
contains = "FROM decisions"

[[check]]
name   = "the decision allocator is not pointed at the view"
sh     = "! grep -n 'FROM live_decisions' internal/events/executor.go 2>/dev/null"

[[check]]
name   = "isDecisionID still reads the table, so a legacy event is not misrouted"
sh     = "grep -n 'FROM decisions WHERE id' internal/events/projector.go"

[[check]]
name   = "every decision read in the CLI goes through the view"
sh     = "! grep -nE 'FROM decisions|JOIN decisions' src/endless/decision_cmd.py 2>/dev/null"

[[check]]
name   = "the rater reads linked decisions through the view"
sh     = "! grep -n 'JOIN decisions' internal/monitor/rater_reads.go 2>/dev/null"

[[check]]
name   = "the doc-mirror sweep reads decisions through the view"
sh     = "! grep -n 'FROM decisions' internal/monitor/doc_mirrors.go 2>/dev/null"

# ── The event name, and the tests that prove it ─────────────────────
# The behaviour itself is proven by the gotest checks above
# (TestKinds_DecisionDeletedIsRetiredButNotEmittable, and
# TestProjectToTempDB_DecisionRemovalRetainsRowAndIDFloor under both
# spellings). These two are tripwires that those tests still exist: a rename
# whose guard tests were deleted would otherwise go green on silence.

[[check]]
name     = "the kind rename is pinned by a test"
sh       = "grep -c 'func TestKinds_DecisionDeletedIsRetiredButNotEmittable' internal/events/event_test.go internal/events/decision_removal_test.go 2>/dev/null | grep -c ':1'"
contains = "1"

[[check]]
name     = "removal parity is pinned under both spellings"
sh       = "grep -c 'KindDecisionDeleted, // retired spelling' internal/events/decision_removal_test.go"
contains = "1"

[[check]]
name     = "the projects guard list is pinned against the live schema"
sh       = "grep -c 'func TestProjectReferences_CoversEverySchemaReference' internal/monitor/project_ignore_test.go"
contains = "1"

[[check]]
name     = "both event spellings reach one executor and one projector"
sh       = "grep -l 'case KindDecisionRemoved, KindDecisionDeleted:' internal/events/projector.go internal/events/executor.go | wc -l | tr -d ' '"
contains = "2"

# ── Project-wide regression ─────────────────────────────────────────

[[check]]
name   = "go build"
sh     = "go build ./..."

[[check]]
name   = "go vet"
sh     = "go vet ./..."
