[[item]]
id = "P1"
kind = "deliverable"
statement = "endless task claim E-N refuses when any other session holds or held E-N, present or ended, changes nothing, and names that session and endless session goto E-N --resume"
verify = "tests in tests/ with a present holder and with an ended one"

[[item]]
id = "P2"
kind = "deliverable"
statement = "endless task bind E-N refuses when any other session holds or held E-N, present or ended, changes nothing, and names that session and endless session goto E-N --resume"
verify = "tests in tests/ with a present holder and with an ended one"

[[item]]
id = "P3"
kind = "deliverable"
statement = "A session claiming or binding its own task again is not refused"
verify = "a test in tests/"

[[item]]
id = "P4"
kind = "deliverable"
statement = "The claim and bind refusals offer --new-transcript only as the user's remedy, never in the text an agent reads"
verify = "a test in tests/ on the refusal output"

[[item]]
id = "P5"
kind = "deliverable"
statement = "The SessionStart cwd auto-bind does not bind a task another present session in a different tmux pane holds, records a fault, and tells the agent through additionalContext and the user through systemMessage to run endless session goto E-N and close this session"
verify = "a Go test in internal/hookcmd"

[[item]]
id = "P6"
kind = "deliverable"
statement = "On a fresh start (SessionStart source startup) in a task's worktree, the auto-bind does not bind when an ended session held the task, unless the launch came from --new-transcript, and tells the agent and the user to run endless session goto E-N --resume"
verify = "Go tests in internal/hookcmd with and without the --new-transcript mark"

[[item]]
id = "P7"
kind = "deliverable"
statement = "session resume --new-transcript and session goto E-N --resume --new-transcript still start a fresh session bound to the task"
verify = "a test in tests/ and a Go test of the auto-bind with the mark"

