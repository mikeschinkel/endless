[[item]]
id = "P1"
kind = "deliverable"
statement = "docs/guide/help/ is renamed to docs/guide/_help/ (with _topics.md inside it), and no code, recipe, command doc, test or message refers to the old path"
verify = "grep -r 'guide/help' over src, tests, justfile and .claude/commands finds nothing; just guide-check passes"

[[item]]
id = "P2"
kind = "deliverable"
statement = "A docs/guide/ entry whose name starts with '_' is never treated as a section or a subsection"
verify = "endless guide --list shows no _help or _topics entry; endless guide _help is refused as unknown"

[[item]]
id = "P3"
kind = "deliverable"
statement = "endless guide <section>/<sub> prints docs/guide/<section>/<sub>.md rendered through the guide template path, with its conditionals resolved"
verify = "test using a fixture subsection that contains a {{if .report_gate}} branch"

[[item]]
id = "P4"
kind = "deliverable"
statement = "endless guide <section> prints only the section's own file, not its subsections"

[[item]]
id = "P5"
kind = "deliverable"
statement = "endless guide --list prints each section slug followed by its subsection addresses in section/sub form"

[[item]]
id = "P6"
kind = "deliverable"
statement = "An unknown subsection address is refused with a message naming that section's existing subsections; an address nested more than one level deep, or under index, is refused as unknown"

[[item]]
id = "P7"
kind = "deliverable"
statement = "One resolver in guide_map.py yields the guide's sections and subsection addresses, and the guide command, guide_sections() and map-file validation all use it"

[[item]]
id = "P8"
kind = "deliverable"
statement = "A map file or _topics.md record may name a subsection address in section:, guide-check accepts it, and the index cross-reference and the AGENT banner show that address"
verify = "tests/test_guide_map.py"

