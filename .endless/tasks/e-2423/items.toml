# Plan items for E-2423: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2423 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "The machine database has a _tasks mirror with id, project_id, removed, title, status, phase, type_id, complexity_id, risk_id, parent_id, prime_requested, created_at and updated_at"

[[item]]
id = "P2"
kind = "deliverable"
statement = "New task ids are allocated from _tasks, not from MAX(id) over tasks"

[[item]]
id = "P3"
kind = "deliverable"
statement = "Every task mutation through the executor updates the matching _tasks row in the same command"

[[item]]
id = "P4"
kind = "deliverable"
statement = "An idempotent reconcile job brings _tasks back in line with tasks, and running it twice changes nothing"

[[item]]
id = "P5"
kind = "deliverable"
statement = "_tasks rows are never deleted; a removed task is marked removed in the mirror"

[[item]]
id = "P6"
kind = "deliverable"
statement = "sessions.task_id, epic_id and focus_task_id, session_gates.epic_id and task_id, session_tasks.task_id, session_hidden_tasks.task_id, session_notices.task_id and rater_claims.task_id are plain FKs to _tasks with no ON DELETE action"
detail = "Plus session_statuses.task_id unless that table is retired first"

[[item]]
id = "P7"
kind = "deliverable"
statement = "A test fails when a table name appears in both the machine schema and the project schema"

[[item]]
id = "P8"
kind = "deliverable"
statement = "Machine-side reads that need only mirror fields read _tasks: tmux pane lookup, the claim check, the auto-spawn and prime outstanding counts, the triage job, the epic walk on claim, the focus update and the Python session list"

[[item]]
id = "P9"
kind = "exclusion"
statement = "errors, errors_sources and error_triage keep plain INTEGER task and session columns, with no FK"

[[item]]
id = "P10"
kind = "exclusion"
statement = "Adds no derived flags (has_plan, landed, open counts) to _tasks"
