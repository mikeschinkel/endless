# Plan items for E-2300: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2300 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "Each tmux binding records its server's socket path in a new tmux_servers table keyed by server_uuid"

[[item]]
id = "P2"
kind = "deliverable"
statement = "A session whose recorded socket now answers with a different server id, or with none, reads dead"

[[item]]
id = "P3"
kind = "deliverable"
statement = "A session whose recorded socket file exists but refuses connections reads dead"

[[item]]
id = "P4"
kind = "deliverable"
statement = "A session whose recorded socket file is missing, or whose probe fails any other way, reads unknown"

[[item]]
id = "P5"
kind = "deliverable"
statement = "No liveness verdict writes to sessions; dead is computed in the session_liveness view only"

[[item]]
id = "P6"
kind = "deliverable"
statement = "Stewardship counts a session as present when its liveness is not dead (live or unknown), matching the claim guard"

[[item]]
id = "P7"
kind = "deliverable"
statement = "WorktreeInUse, session status's in_flight marker and the session graph's live-session flag ignore sessions that read dead"

[[item]]
id = "P8"
kind = "deliverable"
statement = "When a claim or spawn is blocked by an unknown session, the refusal says its server cannot be reached and names endless start (when its Endless server is down) and endless session resume ES-N"

[[item]]
id = "P13"
kind = "deliverable"
statement = "Sessions bound before this change, with no recorded socket, are never judged dead"

[[item]]
id = "P14"
kind = "exclusion"
statement = "Does not scan for tmux servers beyond what liveness observes today (no lsof, no process-table enumeration)"

[[item]]
id = "P15"
kind = "exclusion"
statement = "Does not set sessions.state = 'ended' automatically from any liveness verdict"

[[item]]
id = "P16"
kind = "exclusion"
statement = "Does not filter hooks by tmux server (E-2302) or change where spawns open (E-2385)"

[[item]]
id = "P17"
kind = "exclusion"
statement = "Does not add endless session end (its own task)"
