# Plan items for E-2306: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2306 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "task spawn on a task whose live owner is in session state primed switches the tmux client to that session's pane and creates no window, worktree or status change"

[[item]]
id = "P2"
kind = "deliverable"
statement = "task spawn on a primed task runs before the plan and open-question checks, so a primed task with no plan or with open questions still reaches its session"

[[item]]
id = "P3"
kind = "deliverable"
statement = "task spawn on a primed task pushes the session goto back-stack, so endless session back returns to where the user was"

[[item]]
id = "P4"
kind = "deliverable"
statement = "task spawn on a primed task prints which primed session holds the task and that the user's next message resumes it"

[[item]]
id = "P5"
kind = "deliverable"
statement = "task spawn --no-refocus on a primed task does not switch and prints the window to select"

[[item]]
id = "P6"
kind = "deliverable"
statement = "task spawn on a primed task says that --worktree, --model, --tmux-session and placement options had no effect when any was given"

[[item]]
id = "P7"
kind = "deliverable"
statement = "task spawn on a primed task from a session records relation spawned on that session"

[[item]]
id = "P8"
kind = "deliverable"
statement = "The refusal for a live owner not in state primed names endless session goto and no longer tells the user to have the session release the task"

[[item]]
id = "P9"
kind = "deliverable"
statement = "A session-task relation primed exists with id 8, label Primed, ranked just below spawned, and passes VerifyIntegrity"

[[item]]
id = "P10"
kind = "deliverable"
statement = "task prime run from a session emits session_tasks.primed, which records relation primed on that session for the primed task"

[[item]]
id = "P11"
kind = "deliverable"
statement = "A later spawn of the task from the primer upgrades the primer's row from primed to spawned"

[[item]]
id = "P12"
kind = "deliverable"
statement = "session status lists a primed row with the ◇ mark, in spawned's tier and on spawned's drop-off rule"

[[item]]
id = "P13"
kind = "deliverable"
statement = "Stewardship counts a primer on the filer rung, as it counts a spawner"

[[item]]
id = "P14"
kind = "deliverable"
statement = "task show prints 'Status: <status>; primed in ES-N' while the task's live owner is in state primed, and the bare status otherwise"

[[item]]
id = "P15"
kind = "deliverable"
statement = "task show --json and --agent report status as the bare task status"

[[item]]
id = "P16"
kind = "deliverable"
statement = "task show labels a primed session's row in its Sessions block Bound, not Claimed, pinned by a test"

[[item]]
id = "P17"
kind = "deliverable"
statement = "The orchestration, sessions and tasks guides, and task spawn and task prime help, describe resuming by spawn, the primed relation and the Status suffix"

[[item]]
id = "P18"
kind = "exclusion"
statement = "Does not type into any session's pane (ED-1615)"

[[item]]
id = "P19"
kind = "exclusion"
statement = "Does not claim the task or change its status when spawn reaches a primed session"

[[item]]
id = "P20"
kind = "exclusion"
statement = "Does not record anything on a primer for primes started by the prime job or from a plain shell"
