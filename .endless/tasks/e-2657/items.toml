# Plan items for E-2657: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2657 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "Each Endless server's status-format[1] and menu key bindings name that server's own socket"
verify = "Go test of buildApplySteps for the tasks and console servers"

[[item]]
id = "P2"
kind = "deliverable"
statement = "tmux status-line and show-menu given --socket resolve the pane on that server even when $TMUX names a different server"
verify = "Go test with two private tmux servers that hold the same pane id"

[[item]]
id = "P3"
kind = "deliverable"
statement = "GetPaneStatus and GetTaskForPane receive their target server as a parameter"
verify = "Go test of both lookups against a named private server"

[[item]]
id = "P4"
kind = "deliverable"
statement = "The active-id and tmux display-popup commands inside show-menu's items name the server's socket"
verify = "Go test of buildMenuItems"

[[item]]
id = "P5"
kind = "deliverable"
statement = "tmux status-line without --socket prints the placeholder, exits 0 and makes no tmux call"
verify = "Go test with a tmux seam that fails on any call"

[[item]]
id = "P6"
kind = "deliverable"
statement = "tmux show-menu without --socket refuses and opens no menu"
verify = "Go test of the refusal"

[[item]]
id = "P7"
kind = "deliverable"
statement = "active-id without --socket uses the configured server whose socket matches $TMUX, and reports no task in any other location"
verify = "Go test inside an Endless server, inside another server and outside tmux"

[[item]]
id = "P8"
kind = "deliverable"
statement = "spawn-launch requires --socket and sets its window options on that server with $TMUX unset"
verify = "Go test against a private tmux server"

[[item]]
id = "P9"
kind = "deliverable"
statement = "tmux apply and tmux init require --server tasks or console and configure that server from any shell, with or without $TMUX"
verify = "Go test against private servers from outside tmux and from another server"

[[item]]
id = "P10"
kind = "deliverable"
statement = "tmux apply and tmux init without --server refuse and change no tmux server"
verify = "Go test that the caller's server keeps its options, bindings and hooks"

[[item]]
id = "P11"
kind = "deliverable"
statement = "Server.Init initializes its server without setting $TMUX in the child environment"
verify = "Go test of the command Server.Init builds"

[[item]]
id = "P12"
kind = "deliverable"
statement = "endless start reusing a running server rewrites its status-line and menu lines and keeps its @server_uuid"
verify = "Go test against a private running server"

[[item]]
id = "P13"
kind = "deliverable"
statement = "Each server's generated config declares the four window-switch hooks running monitor-wake with that server's socket, and keeps a user's own hooks on those names"
verify = "Go test of confBody, and a private server started with a user hook on one of the names"

[[item]]
id = "P14"
kind = "deliverable"
statement = "monitor-wake --socket signals the monitors on that server with $TMUX unset"
verify = "Go test against a private tmux server"

[[item]]
id = "P15"
kind = "deliverable"
statement = "monitor-wake without --socket exits 0 and signals nothing"
verify = "Go test of RunWake"

[[item]]
id = "P16"
kind = "deliverable"
statement = "No Endless command installs, repairs or removes the monitor-wake hooks at runtime"
verify = "Go test that a monitor's poll and tmux apply issue no set-hook for them"

[[item]]
id = "P17"
kind = "deliverable"
statement = "A live session monitor or project monitor refuses and starts no loop in a pane of another tmux server and outside tmux"
verify = "Go tests for both monitors in both locations"

[[item]]
id = "P18"
kind = "deliverable"
statement = "A live session monitor and project monitor run in a pane of either Endless server"
verify = "Go test against private servers configured as tasks and console"

[[item]]
id = "P19"
kind = "deliverable"
statement = "project monitor <name> --tmux still opens its window on the console server from any shell"
verify = "Go test run from outside tmux"

[[item]]
id = "P20"
kind = "deliverable"
statement = "Generated lines work when the configured socket directory contains a space"
verify = "Go test against a private server in such a directory"

[[item]]
id = "P21"
kind = "deliverable"
statement = "docs/guide/reference.md describes --server, the monitor refusal, and that Endless does not configure a person's own tmux"
verify = "Read the Tmux integration section"

[[item]]
id = "P22"
kind = "exclusion"
statement = "Does not change how Claude hooks identify their pane or server"

[[item]]
id = "P23"
kind = "exclusion"
statement = "Does not change the callers of TmuxServerUUID outside the status-line, show-menu and active-id lookups"

[[item]]
id = "P24"
kind = "exclusion"
statement = "Does not change session status, project status, or a monitor's single frame when its output is piped"

[[item]]
id = "P25"
kind = "exclusion"
statement = "Does not add the console's own status line content"
