[[item]]
id = "P1"
kind = "deliverable"
statement = "$HOME and every directory above it can never be a project, and no override can change that"
verify = "TestResolveDirectory_HomeAndAboveAreDisallowed, TestResolveDirectory_HomeCannotBeRemoved"

[[item]]
id = "P2"
kind = "deliverable"
statement = "A directory outside $HOME can still be a project"
verify = "TestResolveDirectory_OutsideHomeIsAllowed"

[[item]]
id = "P3"
kind = "deliverable"
statement = "A project row at $HOME is never inherited by a directory under it"
verify = "TestResolveDirectory_HomeRowIsNeverInherited"

[[item]]
id = "P4"
kind = "deliverable"
statement = "The hook never auto-registers a disallowed directory or one holding a project"
verify = "TestProjectIDForPath_NeverAutoRegistersHome, TestResolveDirectory_NestedProjects"

[[item]]
id = "P5"
kind = "deliverable"
statement = "A built-in per-OS list (Linux FHS and XDG dirs, macOS, Windows) refuses system and user-data directories, scoped self or subtree"
verify = "docs/guide/disallowed-paths.md; TestResolveDirectory_DownloadsIsASubtree"

[[item]]
id = "P6"
kind = "deliverable"
statement = "Downloads and the media folders are refused as subtrees; Documents, Desktop and Public only as themselves"
verify = "TestResolveDirectory_DownloadsIsASubtree; docs/guide/disallowed-paths.md"

[[item]]
id = "P7"
kind = "deliverable"
statement = "User folders are located by the OS: user-dirs.dirs on Linux, the known-folder API on Windows, fixed names on macOS"
verify = "TestXDGUserDir_LocalizedAndDisabled, TestKnownFolder_MacOSCallsVideosMovies"

[[item]]
id = "P8"
kind = "deliverable"
statement = "A parent directory, declared by an override or an .endless-parent-dir marker, is not a project and stops the walk-up; ~/Projects is one by default"
verify = "TestResolveDirectory_ParentDirStopsTheWalk, TestResolveDirectory_ProjectsIsABuiltinParentDir"

[[item]]
id = "P9"
kind = "deliverable"
statement = "disallowed-paths.json in the config dir holds only additions and removals, is created as a skeleton on first need, and a malformed file is an error naming it"
verify = "TestResolveDirectory_SelfAndSubtreeOverrides, TestResolveDirectory_OverrideRemovesABuiltin, TestReadOverrides_*"

[[item]]
id = "P10"
kind = "deliverable"
statement = "The full built-in list is generated into docs/guide/disallowed-paths.md, shown by endless guide disallowed-paths, and a test fails when it drifts"
verify = "TestDisallowedPathsDocIsCurrent; just disallowed-doc"

[[item]]
id = "P11"
kind = "deliverable"
statement = "A project nested inside or around another registered project is refused by register, discover and reconcile"
verify = "tests/test_disallowed_projects.py"

[[item]]
id = "P12"
kind = "deliverable"
statement = "project register, discover and reconcile refuse disallowed directories, naming the rule"
verify = "tests/test_disallowed_projects.py"

[[item]]
id = "P13"
kind = "deliverable"
statement = "A directory's own .endless/config.json never makes $HOME a project"
verify = "tests/test_disallowed_projects.py::test_a_home_config_file_does_not_make_home_a_project"

[[item]]
id = "P14"
kind = "deliverable"
statement = "project unregister deletes a row at a disallowed path instead of marking it ignored, and project list flags disallowed and nested rows"
verify = "tests/test_disallowed_projects.py::test_unregister_deletes_a_row_at_home"

[[item]]
id = "P15"
kind = "exclusion"
statement = "Does not offer an opt-in to allow nested projects"
