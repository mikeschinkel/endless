# Plan items for E-2397: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2397 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "A user-only endless db recover detects main's schema version being ahead of the installed endless-go, and names both versions"
verify = "Against a database one version ahead it names both versions; against one at the installed version it says there is nothing to recover and changes nothing"

[[item]]
id = "P2"
kind = "deliverable"
statement = "Recover picks the backup the unwanted migration took just before it applied, by its link to that migration, never the newest"
verify = "With a newer scheduled backup present, the pre-migration backup is the one chosen"

[[item]]
id = "P3"
kind = "deliverable"
statement = "A maintenance lock that every Endless opener honors (CLI, hooks, tmux status line, monitors, jobs) by refusing quietly while it is set"
verify = "Each opener, run while the lock is set, refuses without opening or creating a database"

[[item]]
id = "P4"
kind = "deliverable"
statement = "Recover sets the lock, waits for open handles to close, names any that remain, and clears the lock on every exit path"
verify = "The lock is clear after a restore that fails partway, and a held handle is named"

[[item]]
id = "P5"
kind = "deliverable"
statement = "The restore copies the backup beside the database and renames it into place, so the path is never empty; db restore uses the same path"
verify = "An opener during the restore window never finds an empty path or creates a fresh database, through recover or db restore"

[[item]]
id = "P6"
kind = "deliverable"
statement = "After restoring, recover checks the schema version, PRAGMA integrity_check, and row counts against the backup"
verify = "A restored copy that differs from its backup is reported as a failure"

[[item]]
id = "P7"
kind = "deliverable"
statement = "When the branch that migrated main is landable, recover says landing it is the cheaper fix and names the command"
verify = "With a landable branch carrying the migration, the output names its worktree land command"

[[item]]
id = "P8"
kind = "exclusion"
statement = "Rebuilding task state from the ledger, so task changes made after the backup come back, is left to a later child task"

[[item]]
id = "P9"
kind = "deliverable"
statement = "Fix test_plan_items' terminal-size fake, which leaked into pytest's terminal writer and aborted the Python suite after ~1300 tests"
