# Plan items for E-2520: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2520 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "No Go file in Endless imports github.com/mikeschinkel/go-doterr"
verify = "git grep -n 'mikeschinkel/go-doterr' -- '*.go'"

[[item]]
id = "P2"
kind = "deliverable"
statement = "Every Endless package that uses doterr holds its own doterr.go, identical to go-doterr's doterr.go apart from the package clause, and calls NewErr, WithErr and StringKV without a package qualifier"
verify = "git grep -n 'doterr\\.' -- '*.go'; diff each copy against go-doterr's doterr.go minus its package line"

[[item]]
id = "P3"
kind = "deliverable"
statement = "Endless's go.mod and go.sum mention go-doterr nowhere"
verify = "grep -n go-doterr go.mod go.sum"

[[item]]
id = "P4"
kind = "deliverable"
statement = "No WithErr call in Endless enriches an error built by another Endless package's doterr copy, and a test fails if ErrCrossPackageError appears where one was enriched"

[[item]]
id = "P5"
kind = "deliverable"
statement = "go build, go vet and the Go tests pass"

[[item]]
id = "P6"
kind = "deliverable"
statement = "The endless, gomion and go-doterr projects each hold a decision stating go-doterr is a drop-in, never a module dependency, with the same text"
verify = "endless decision list in each project"

[[item]]
id = "P7"
kind = "deliverable"
statement = "The owner has the exact text of the drop-in rule to paste under Cross-Package Dependencies in the go-pkgs CLAUDE.md"

[[item]]
id = "P8"
kind = "exclusion"
statement = "Does not change go-doterr's doterr.go"

[[item]]
id = "P9"
kind = "exclusion"
statement = "Does not touch other projects that import go-doterr, such as macmail-ext, doctool and xmlui"

[[item]]
id = "P10"
kind = "exclusion"
statement = "Does not remove Endless's other replace directives"
