# Plan items for E-2394: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2394 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "endless session end <ref> ends a session, resolving ref as endless session resume does"

[[item]]
id = "P2"
kind = "deliverable"
statement = "session end refuses a session that reads live"

[[item]]
id = "P3"
kind = "deliverable"
statement = "session end refuses a session with activity in the last 10 minutes unless --force"

[[item]]
id = "P4"
kind = "deliverable"
statement = "session end shows the session's task, last activity and liveness and asks y/N; --yes skips the prompt; with no terminal and no --yes it refuses"

[[item]]
id = "P5"
kind = "deliverable"
statement = "After ending, session end prints how to get the session back (endless session resume ES-N) and that its task can now be claimed"

[[item]]
id = "P6"
kind = "deliverable"
statement = "When a claim or spawn is blocked by an unknown session, the refusal also names endless session end ES-N"

[[item]]
id = "P7"
kind = "exclusion"
statement = "Does not end sessions automatically, and does not add SQLite access to Python"

[[item]]
id = "P8"
kind = "deliverable"
statement = "session end writes through a new endless-go session-query end-session verb (lock release + EndSession, as the SessionEnd hook does), not the session.ended event, which has no executor; resume-target gains last_activity"
