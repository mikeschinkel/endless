# Plan items for E-2217: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2217 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "Register derives a project's identity from its repo's root commit (the oldest, when histories merged) and stores it in .endless/config.json and projects.identity"
verify = "verify.sh sections 2; tests/test_project_identity.py root-commit tests"

[[item]]
id = "P2"
kind = "deliverable"
statement = "A stored identity is never re-derived, so a history rewrite does not change it"
verify = "test_reregistering_keeps_a_stored_identity"

[[item]]
id = "P3"
kind = "deliverable"
statement = "Register refuses a directory that is not a git repo, or a repo with no commits, writing nothing"
verify = "verify.sh section 5"

[[item]]
id = "P4"
kind = "deliverable"
statement = "Register refuses a second clone or a fork of a registered project, naming the registered path, pointing at worktrees and saying forks are unsupported"
verify = "verify.sh section 3"

[[item]]
id = "P5"
kind = "deliverable"
statement = "Register refuses a name another registered project holds as its name or slug, naming its path and the --name fix"
verify = "verify.sh section 4"

[[item]]
id = "P6"
kind = "deliverable"
statement = "projects.slug is machine-local: it defaults to the name, survives a rename, and never reaches a committed file or the ledger"
verify = "verify.sh section 7"

[[item]]
id = "P7"
kind = "deliverable"
statement = "Migration 22 adds projects.identity and projects.slug with unique indexes and sets slug = name on existing projects"
verify = "TestMigrate_AddsProjectIdentity"

[[item]]
id = "P9"
kind = "deliverable"
statement = "Project sync no longer repoints a registered project at a second clone"
verify = "verify.sh section 6"

[[item]]
id = "P10"
kind = "deliverable"
statement = "A checkout whose registered original no longer exists takes the project over, tasks and all"
verify = "test_a_checkout_whose_original_is_gone_takes_the_project_over"

[[item]]
id = "P11"
kind = "exclusion"
statement = "Prompting for a different slug at registration, and naming per-project database files by slug, are left to E-2215"
