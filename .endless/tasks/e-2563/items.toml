[[item]]
id = "P1"
kind = "deliverable"
statement = "Endless core has a worktree extension point that runs after a task worktree is created and before a session starts in an existing worktree on task spawn, task claim and session resume"

[[item]]
id = "P2"
kind = "deliverable"
statement = "The core contains no language-specific code, and a failing extension prints an error naming itself and the worktree without stopping the spawn, claim or resume"

[[item]]
id = "P3"
kind = "deliverable"
statement = "A Go-support module, separate from the core, registers with the extension point and applies only to worktrees containing a go.mod outside .endless/, vendor/ and testdata/"

[[item]]
id = "P4"
kind = "deliverable"
statement = "A Go worktree without a go.work gets one listing every module in it, including nested test/ and examples/ modules, so go build ./... succeeds even when the main checkout has a go.work"

[[item]]
id = "P5"
kind = "deliverable"
statement = "A worktree that already has a go.work is left unchanged"

[[item]]
id = "P6"
kind = "deliverable"
statement = "A worktree created before this change gets its go.work the next time a session is spawned, claimed or resumed in it"

[[item]]
id = "P7"
kind = "deliverable"
statement = "When the written go.work is not covered by the repo's .gitignore, Endless prints a warning to add go.work and go.work.sum to .gitignore, and never writes .git/info/exclude"

[[item]]
id = "P8"
kind = "deliverable"
statement = "Tests cover a new Go worktree under a main checkout with a go.work, nested modules, an existing go.work, a non-Go worktree, an existing worktree on resume, and the warning"

[[item]]
