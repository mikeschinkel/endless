# ── DO NOT EDIT ─────────────────────────────────────────────────────
# This suite belongs to E-2519 and records what was true when E-2519
# landed. Edit it only if you ARE E-2519. If your change breaks a check
# here, leave it alone — see .endless/tasks/CLAUDE.md.
#
# E-2519 refuses to resume a Claude session that is already running: one
# check runs before each of the three `claude --resume` launches, matching
# the target's UUID against every project's live sessions and against the
# running `claude` processes, and names `endless session goto <ref>`. A
# session on a tmux server with no recorded socket that the scan did not
# see reads `dead`.

schema = 1
task   = "E-2519"

# The liveness view's new cell (unrecorded, unobserved server → dead), the
# gone-server truth table with its flipped case, the recorded test server, and
# list-live through the binary.
[[check]]
name   = "unrecorded unobserved server reads dead; list-live omits it"
runner = "gotest"
paths  = ["./internal/monitor/", "./internal/sessionquerycmd/"]

# The guard on all three launches, both of its sources, the unknown/unbound
# and --new-transcript exemptions, the process-listing parser, the plain-goto
# hint for a target running out of reach, and the goto/resume suites the
# guard sits in.
[[check]]
name   = "resume refuses a running target; exemptions hold"
runner = "pytest/uv"
paths  = ["tests/test_session_resume_refuses_running.py",
          "tests/test_session_goto_back.py",
          "tests/test_session_resume_crash_recovery.py",
          "tests/test_session_resume_window_options.py",
          "tests/test_session_lookup_any_project.py"]

# One check function, called at the two code paths behind the three launches
# (goto --resume and --background share _resume_new_window_pane).
[[check]]
name = "one running check, defined once, called before each launch path"
sh   = "test \"$(grep -c '^def _running_refusal' src/endless/session_cmd.py)\" = 1 && test \"$(grep -c 'refusal = _running_refusal(' src/endless/session_cmd.py)\" = 2"

# The check reads every project's live sessions, never the cwd's.
[[check]]
name     = "the running check matches against every project's live sessions"
sh       = "sed -n '/^def _running_session/,/^def _running_refusal/p' src/endless/session_cmd.py"
contains = "_live_sessions(all_projects=True)"

# goto --help says what --resume does when the target is running.
[[check]]
name     = "goto --help names the refusal"
sh       = 'uv run endless session goto --help | tr "\n" " " | tr -s " "'
contains = "refused when it is running somewhere this tmux server cannot see"

# The sessions guide states both rules.
[[check]]
name     = "sessions guide: a running session is never resumed"
sh       = "uv run endless guide sessions"
contains = "A running session is never resumed"

[[check]]
name     = "sessions guide: unrecorded unobserved servers read dead"
sh       = "uv run endless guide sessions"
contains = "has no recorded socket and that the socket scan did not see reads `dead`"
