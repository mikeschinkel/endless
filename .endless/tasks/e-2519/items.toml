# Plan items for E-2519: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2519 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "session resume refuses a target that is live in any project and names endless session goto <ref>"

[[item]]
id = "P2"
kind = "deliverable"
statement = "session goto --resume on a running target fails, saying it is running and to drop --resume"

[[item]]
id = "P3"
kind = "deliverable"
statement = "goto --resume --background refuses a running target and names endless session goto <ref>"

[[item]]
id = "P4"
kind = "deliverable"
statement = "Every resume launch refuses when a running claude process has --resume with the target's UUID"

[[item]]
id = "P5"
kind = "deliverable"
statement = "One check function runs before each of the three claude --resume launches"

[[item]]
id = "P6"
kind = "deliverable"
statement = "A target reading unknown or unbound stays resumable unless the process check finds it running"

[[item]]
id = "P7"
kind = "deliverable"
statement = "--new-transcript is not checked"

[[item]]
id = "P8"
kind = "deliverable"
statement = "A session whose tmux server has no recorded socket and was not seen in the socket scan reads dead"

[[item]]
id = "P9"
kind = "exclusion"
statement = "Ending or editing session rows to repair stale liveness; the liveness rule covers them"

[[item]]
id = "P10"
kind = "exclusion"
statement = "Test-fixture session rows in the main database; evidence added to E-2050"

[[item]]
id = "P12"
kind = "deliverable"
statement = "A seeded test pane binding records its tmux server, as a hook's first binding does; the pre-E-2300 shape is explicit"

[[item]]
id = "P13"
kind = "deliverable"
statement = "session goto, goto --resume, goto --resume --background and session back address Endless's task-session server by socket path, never the caller's tmux server; with it down they refuse with 'Endless isn't running' and move nothing"
detail = "Replaces P11. The guide already says every Endless command reaches the two servers by full socket path; goto and back ran bare tmux against the ambient server."

[[item]]
id = "P14"
kind = "deliverable"
statement = "The live-session rows scope pane ids to the task-session server's identity, so a target's pane resolves from any shell; a hook still binds a pane to the server it runs in"

[[item]]
id = "P15"
kind = "deliverable"
statement = "goto from a terminal not attached to the task-session server selects the target's window there and prints the attach command when no terminal is attached; the back-stack is pushed only for a client of that server"

[[item]]
id = "P16"
kind = "deliverable"
statement = "The running-session refusals on resume, and plain goto's not-live hint, name the task-session server's window and give the reach command; a session running only as a bare claude --resume process names the process"

[[item]]
id = "P17"
kind = "deliverable"
statement = "A bare session resume outside a task-session server pane refuses before launching, points at session goto <ref> --resume, and offers --new-window, which opens the resume in a new window of the task-session server as goto --resume does"
