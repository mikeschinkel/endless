# Plan items for E-2585: a mirror of the database. Do not edit this file;
# copy it, edit the copy, and load it with
#   endless task update E-2585 --items-file <copy>

[[item]]
id = "P1"
kind = "deliverable"
statement = "No Go or Python code reads or writes sessions.session_id, sessions.platform or sessions.transcript_offset"
verify = "grep finds no reference outside migrations and the schema history comments"

[[item]]
id = "P2"
kind = "deliverable"
statement = "The sessions table no longer has session_id, platform or transcript_offset columns"
verify = "PRAGMA table_info(sessions) on a migrated copy of a real database"

[[item]]
id = "P3"
kind = "deliverable"
statement = "session_messages rows reference session_instances by an INTEGER NOT NULL session_instance_id"
verify = "a clear gives later messages the new instance and leaves earlier rows unchanged"

[[item]]
id = "P4"
kind = "deliverable"
statement = "Full-text search over session messages returns hits after the session_messages rebuild"

[[item]]
id = "P5"
kind = "deliverable"
statement = "sessions_task_id_write_once still refuses a second task_id after the sessions rebuild"

[[item]]
id = "P6"
kind = "deliverable"
statement = "Every session and every harness UUID that existed before the migration still resolves afterward"
verify = "assert as a law against a copy of a real database"

[[item]]
id = "P7"
kind = "deliverable"
statement = "monitor.ParseTranscript takes the instance id instead of the UUID"

[[item]]
id = "P8"
kind = "deliverable"
statement = "Resume with exactly one open instance resumes it without asking"

[[item]]
id = "P9"
kind = "deliverable"
statement = "Resume with two or more open instances exits non-zero, lists them first_seen_at ascending with ordinals, and closes none"

[[item]]
id = "P10"
kind = "deliverable"
statement = "Resume accepts --instance with an ordinal or a UUID to pick one"

[[item]]
id = "P11"
kind = "deliverable"
statement = "Resume starts claude in the instance's launch_dir, and in the worktree when launch_dir is NULL"
verify = "covers both session resume and session goto --resume, and the new-window path"
