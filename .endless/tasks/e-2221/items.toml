[[item]]
id = "P1"
kind = "deliverable"
statement = "An unspawned task listed on another present session's board shows ◫ on this board, whatever put it on either board (filed, updated, touched, dependent, blocker or child)"
verify = "Go tests in internal/monitor with the task on the other board as a dependent, as a blocker, and as a touched task"

[[item]]
id = "P2"
kind = "deliverable"
statement = "A task some session claims or binds never shows ◫ on any board"
verify = "a Go test in internal/monitor"

[[item]]
id = "P3"
kind = "deliverable"
statement = "A row another board suppresses or hides does not count as listed there, so it sets no ◫ elsewhere"
verify = "Go tests in internal/monitor for a suppressed and a hidden row"

[[item]]
id = "P4"
kind = "deliverable"
statement = "On its planning session's board an unspawned task shows without ◫"
