statement = "An unspawned task another session is planning is suppressed on every other board, unless that board's session touched it, where it shows with ◫"
verify = "Go tests in internal/monitor for an untouched and a touched board"

[[item]]
id = "P6"
kind = "deliverable"
statement = "An unspawned task another present session stewards is suppressed on this board, unless this board's session touched it, where it shows with ◫"
